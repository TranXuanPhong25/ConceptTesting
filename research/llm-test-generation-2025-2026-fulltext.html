ept applicability.** Very high. Turn a bug report into a fault concept: triggering values, environment, expected/actual behavior, and prohibited preconditions. This is a better semantic target than an AST tag because it originates in an observed defect.\n- **Evidence.** Full text. [Open-access publisher PDF](https://orbilu.uni.lu/bitstream/10993/65666/1/s10664-025-10635-z%20%284%29.pdf)\n- **Artifacts (checked 2026-09-29).** Code: verified source [anonymous.4open.science/r/BRMiner-C853](https://anonymous.4open.science/r/BRMiner-C853) (Anonymous repo live: Python BRMiner (GitHub/Jira extractors), EvoSuite experiments; anonymous links can expire). Dataset: Defects4J v2.0.0 + GitHub/Jira bug reports; extracted literals released — released by authors [anonymous.4open.science/r/BRMiner-C853](https://anonymous.4open.science/r/BRMiner-C853). Models: GPT-3.5-turbo.\n\n## 64. An MLLM-Assisted Web Crawler Approach for Web Application Fuzzing\n\n- **Method.** A multimodal LLM assists web crawling so the fuzzer can discover interfaces behind multi-step interactions and dynamic page structure; discovered interfaces become fuzzing targets.\n- **Motivation.** Conventional web fuzzers miss attack surface when forms, navigation, and client-side state hide endpoints from a crawler.\n- **Dataset + shape.** The paper evaluates its crawler/fuzzer on web applications; the open PDF is accessible, but I did not extract a defensible subject count from the available text in this pass.\n- **Evaluation results.** The paper reports improved test-interface coverage over its baselines. I am leaving the numerical result out rather than reconstructing it from figures without a verified table read.\n- **Concept applicability.** High. The concept should describe page state, required prior actions, form fields, authentication role, and target request property. That is materially more actionable than asking an LLM to “fuzz this URL.”\n- **Evidence.** Full text, numeric result not transcribed. [Publisher PDF](https://www.mdpi.com/2076-3417/15/2/962/pdf)\n- **Artifacts (checked 2026-09-29).** Code: none found (No repo for CrawlMLLM; built on third-party BoB-WebFuzzing/Request-Crawler; DAS says data in article; gh search empty). Dataset: 9 PHP web apps (Table 1) + DVWA/XVWA/bWAPP + 6 real-world apps; Burp/ZAP audits — public benchmark only. Models: GPT-4o.\n\n## 65. LLM-Driven, Self-Improving Framework for Security Test Automation: Leveraging Karate DSL for Augmented API Resilience\n\n- **Method.** Karate-BOLA-Guard combines LLM generation, retrieval augmentation, observability, and Karate DSL execution to generate and refine API-security tests.\n- **Motivation.** API security tests need endpoint semantics, authentication context, and vulnerability-specific attack cases; static hand-written suites age quickly.\n- **Dataset + shape.** Abstract-only. The publisher landing page confirms a 26-page IEEE Access article but the accessible primary material did not provide a reproducible dataset description.\n- **Evaluation results.** Abstract-only. Do not cite a quantitative effectiveness claim from this note.\n- **Concept applicability.** High in principle. CWE/BOLA type, actor roles, ownership relation, endpoint, object identifier, and expected authorization result form a natural concept schema. It is relevant to concept-guided red/green testing, but needs a reproducible benchmark before becoming an evaluation target.\n- **Evidence.** Abstract-only. [IEEE Access DOI](https://doi.org/10.1109/ACCESS.2025.3554960)\n- **Artifacts (checked 2026-09-29).** Code: verified source [github.com/EmilMarian/Karate-BOLA-Guard-Framework](https://github.com/EmilMarian/Karate-BOLA-Guard-Framework) (Python RAG/Karate test-gen framework + results/logs, 5.9 MB, last push 2025-02; matched by name+author (footnote URL not rendered)). Dataset: VAmPI, crAPI, OWASP Juice Shop + 15 production API specs; generated tests/logs in repo — released by authors [github.com/EmilMarian/Karate-BOLA-Guard-Framework/tree/master/results](https://github.com/EmilMarian/Karate-BOLA-Guard-Framework/tree/master/results). Models: Mistral-7B-Instruct (GGUF Q4_0), Wizard-v1.2-13B (GGUF Q4_0), Llama-3-8B-Instruct (GGUF Q4_0), Phi-3-Mini-Instruct (GGUF Q4_0).\n\n## 66. GRPO with State Mutations: Improving LLM-Based Hardware Test Plan Generation\n\n- **Method.** The work splits hardware verification into a natural-language sub-unit test plan and an executable testbench. It trains a 7B model with supervised fine-tuning plus GRPO-SMu, which varies mutated RTL states in a tree rather than sampling repeatedly from one state.\n- **Motivation.** General LLMs produce weak RTL stimuli because a single RTL state yields low reward diversity and poor exploration. The authors want tests that pass golden RTL but expose mutated RTL.\n- **Dataset + shape.** Curated RTL-description, golden-RTL, mutated-RTL, test-plan, and testbench examples. The paper describes tree-based mutation with three mutation types per source state; the accessible manuscript does not state a clean total instance count in the abstract sections reviewed.\n- **Evaluation results.** DeepSeek-R1 and Claude-4.0-Sonnet pass golden designs for 15.7-21.7% of generated stimuli. The trained 7B model reaches 33.3% golden-test pass and 13.9% mutation detection, a reported 17.6-point absolute improvement over its baseline.\n- **Concept applicability.** High. A mutation operator plus changed state is an explicit concept. The transferable idea is to give the generator several semantically related counterfactual program states, rather than only one target line and one coverage bit.\n- **Evidence.** Full text. [Author arXiv manuscript](https://arxiv.org/abs/2601.07593)\n- **Artifacts (checked 2026-09-29).** Code: none found (NVIDIA/MIT; no code or data link in paper; GitHub search for GRPO-SMu empty). Dataset: Curated set derived from ScaleRTL (1,500 eval RTL; 1,902 SFT traces; mutated RTL tree) — not released. Models: DeepSeek-R1-Distill-Qwen-7B (SFT+GRPO-SMu), DeepSeek-R1, Claude-4.0-Sonnet, Claude-3.7-Sonnet (data curation), LLaMa-3.1-405B, ScaleRTL-32B.\n\n## 67. Generating Failure-Based Oracles to Support Testing of Reported Bugs in Android Apps\n\n- **Method.** AndroB2O takes a bug report and the GUI screen implicated in the failure. It identifies relevant widgets and generates assertions over their properties to detect the reported non-crashing failure. The authors also connect it to the ReBL reproduction tool.\n- **Motivation.** Android functional bugs often manifest visually rather than as crashes, so a reproduction trace alone has no oracle. Writing a regression assertion requires reconciling natural-language reports, GUI elements, and erroneous UI state.\n- **Dataset + shape.** A new dataset of 152 Android bug-report failures with GUI interactions and failure-revealing oracles.\n- **Evaluation results.** AndroB2O generated an oracle that identified the reported failure for 61.2% of the 152 failures. The paper reports an additional integration evaluation with ReBL, but I do not repeat its detailed figures here without the corresponding table.\n- **Concept applicability.** Very high. This is almost the desired semantic form: bug report -> affected GUI state -> failure property -> assertion. Concepts can encode widget, property, expected value/relation, reproduction state, and a fixed-version pass condition.\n- **Evidence.** Full text. [Author-hosted ASE PDF](https://ojcchar.github.io/files/40-ase25-br-oracles.pdf); [dataset record](https://doi.org/10.5281/zenodo.15556567)\n- **Artifacts (checked 2026-09-29).** Code: verified source [doi.org/10.5281/zenodo.15556567](https://doi.org/10.5281/zenodo.15556567) (Zenodo Artifact.zip 5.4 GB: 'Pipeline Script' Python/ipynb (GPT+Llama), prompts, APKs, Espresso repro project). Dataset: FBO4A: 152 non-crashing Android bug reports from 24 apps, with oracles — released by authors [doi.org/10.5281/zenodo.15556567](https://doi.org/10.5281/zenodo.15556567). Models: GPT-4 Turbo (gpt-4-0125-preview), GPT-4o (gpt-4o-2024-11-20), Llama-4-Maverick.\n\n## 68. On the Challenges of Fuzzing Techniques via Large Language Models\n\n- **Method.** Position/challenge paper on using LLMs across fuzzing, rather than a new fuzzer with a benchmarked algorithm.\n- **Motivation.** LLM-assisted fuzzing faces recurring problems: valid structured inputs, hallucinated APIs or grammars, expensive calls, weak feedback loops, and evaluation that confuses coverage with fault discovery.\n- **Dataset + shape.** No experimental dataset.\n- **Evaluation results.** No tool evaluation; it identifies research challenges.\n- **Concept applicability.** Useful as design pressure, not as an evaluation baseline. A concept representation should be executable or checkable, so it can be rejected when it contradicts the grammar, program state, or feedback trace.\n- **Evidence.** Abstract-only for this pass. [IEEE conference DOI](https://doi.org/10.1109/SSE67621.2025.00028)\n- **Artifacts (checked 2026-09-29).** Code: none found (Literature survey/systematic overview; no tool). Dataset: N/A (literature survey, no experimental data) — not released. Models: none (no experiments).\n\n## 69. Harden and Catch for Just-in-Time Assured LLM-Based Software Testing\n\n- **Method.** The paper formalizes hardening tests, which pass now and aim to guard against future regressions, and catching tests, which reveal a fault introduced by a code change. It defines the Catching Just-in-Time Test challenge and discusses deployment outcomes.\n- **Motivation.** Coverage and passing tests do not tell a team whether a generated test would have stopped a faulty change before release. The authors want an outcome tied to engineering value.\n- **Dataset + shape.** This is a position/keynote paper, not a benchmark release. It discusses early Meta experience but does not offer a public dataset or a comparable aggregate score.\n- **Evaluation results.** No standalone controlled evaluation to report.\n- **Concept applicability.** Direct. Define the concept around a code change, hypothesized regression, pre-change invariant, and expected post-change behavior; then measure whether the test passes the parent and fails the buggy child. This is a cleaner target for the planned TestExplora-style F2P loop than line coverage.\n- **Evidence.** Full text. [Author arXiv manuscript](https://arxiv.org/abs/2504.16472)\n- **Artifacts (checked 2026-09-29).** Code: none found (Position/open-challenges paper (Meta); no tool or artifact released). Dataset: N/A (position paper, no experiments) — not released. Models: none (no experiments).\n\n## 70. Program Interoperable Large Language Model Software Testing Scheme: A Case Study on JavaScript Engine Fuzzing\n\n- **Method.** PILLM instruments JavaScriptCore, prompts an LLM with source semantics, evaluates generated tests for semantic relevance, and uses coverage/execution feedback to steer subsequent seed generation.\n- **Motivation.** LLMs do not directly interact with a program, and one-shot test generation lacks a trustworthy quality signal. PILLM supplies both a program-to-LLM interaction mechanism and a feedback loop.\n- **Dataset + shape.** JavaScriptCore/WebKit, verified by the released artifact against WebKitGTK 2.41.6. The paper runs 24-hour fuzzing campaigns.\n- **Evaluation results.** In 24-hour runs PILLM improved coverage by 45.7% over Fuzz4All and 14.9% over Fuzzilli, and found four new JavaScript-engine bugs.\n- **Concept applicability.** High. Its semantic seed scorer can become a concept validator: retain generated programs only if they exhibit the target API relation, guard, or execution-state transition. Pairing concepts with coverage feedback is the important part, not merely adding prose to a prompt.\n- **Evidence.** Full text evidence via primary article abstract and official artifact. [IEEE article](https://ieeexplore.ieee.org/document/11044883/); [official code](https://github.com/DPCa0/PILLM)\n- **Artifacts (checked 2026-09-29).** Code: verified source [github.com/DPCa0/PILLM](https://github.com/DPCa0/PILLM) (Python instrument/generate/fuzz scripts + prompts + Fuzz4All baseline, 32.9 MB, last push 2025-03). Dataset: JavaScriptCore (WebKitGTK 2.41.6) as fuzz target; baselines Fuzz4All, Fuzzilli — public benchmark only. Models: GPT-4o.\n\n## 71. AutoQALLMs: Automating Web Application Testing Using LLMs and Selenium\n\n- **Method.** The framework extracts HTML, asks GPT-4/Claude/Grok to generate Selenium scripts, cleans generated code with regexes, executes it, and reports results. The user supplies a URL.\n- **Motivation.** Manual browser-test authoring does not keep pace with frequently changing sites; the authors target one-click test generation from rendered web content.\n- **Dataset + shape.** The paper uses web pages/sites as subjects. The accessible full text did not provide a stable benchmark-size statement that I can quote with confidence.\n- **Evaluation results.** The paper compares models and says Claude 4.5 achieved slightly higher coverage, while GPT-4 was chosen as the default for cost, reproducibility, and script stability. I am not reporting an unverified aggregate percentage.\n- **Concept applicability.** Moderate. Concepts should carry action preconditions, DOM-role selectors, data constraints, and expected page-state assertions. Raw HTML is a poor substitute for this semantic state.\n- **Evidence.** Full text, dataset/result count not transcribed. [University-hosted published PDF](https://uhra.herts.ac.uk/id/eprint/26265/1/computers-14-00501.pdf)\n- **Artifacts (checked 2026-09-29).** Code: verified source [github.com/Sindhupriya2797/AutoQALLMs](https://github.com/Sindhupriya2797/AutoQALLMs) (Python Selenium+LLM generator, compare-LLM script, backend/frontend, 241 KB, last push 2026-03). Dataset: 30 public automation-practice websites (Table 4) — public benchmark only. Models: GPT-4 (gpt-4), Claude Sonnet 4.5 (claude-sonnet-4-5-20250929), Grok (grok-code-fast-1).\n\n## 72. CrossGuard: Runtime-Adaptive LLM Fuzzing for Cross-Contract Vulnerabilities Detection\n\n- **Method.** LLM-driven fuzzing for vulnerabilities that emerge from interactions across smart contracts, with runtime adaptation.\n- **Motivation.** Single-contract fuzzers miss behaviors that require cross-contract call chains and evolving blockchain state.\n- **Dataset + shape.** Abstract-only. The accessible Wiley record did not expose the experimental corpus or subject count.\n- **Evaluation results.** Abstract-only. No numerical claim recorded.\n- **Concept applicability.** High in principle. A concept needs call-chain topology, caller/callee roles, storage state, authorization condition, asset-flow relation, and target vulnerability class. This is a good target domain for stateful concepts but not yet a reproducible source for this repo.\n- **Evidence.** Abstract-only. [Wiley DOI](https://doi.org/10.1002/cpe.70421)\n- **Artifacts (checked 2026-09-29).** Code: data/prompts only, no tool source [github.com/ghazi1987/CrossGuard/tree/master](https://github.com/ghazi1987/CrossGuard/tree/master) (Paper ref [53]; master branch = 500 .sol contracts only, no fuzzer source; main branch near-empty; last push 2025-09). Dataset: 500 cross-contract Solidity contracts (Etherscan/SmartBugs-Wild); baselines CrossFuzz, xFuzz — released by authors [github.com/ghazi1987/CrossGuard/tree/master](https://github.com/ghazi1987/CrossGuard/tree/master). Models: Llama-3.3-70B.\n\n## 73. One Mutation Fits All: Exploring Universal Library Fuzzing Based on Exogenous Mutation\n\n- **Method.** Exogenous mutation for reusable library fuzzing. The exact construction and evaluation need the paper PDF; the IEEE landing page was accessible but did not provide full text in this pass.\n- **Motivation.** Libraries need fuzzing strategies that transfer across APIs instead of bespoke mutators per target.\n- **Dataset + shape.** Abstract-only.\n- **Evaluation results.** Abstract-only.\n- **Concept applicability.** Potentially high. The “mutation relation” is a natural concept, but this needs full-text confirmation before borrowing its method or claims.\n- **Evidence.** Abstract-only. [IEEE DOI](https://doi.org/10.1109/TDSC.2025.3588878)\n- **Artifacts (checked 2026-09-29).** Code: none found (No repo found (gh/web search); TDSC full text paywalled). Dataset: 20 real-world libraries (C++, Python, Java, JS) with AFL++, libFuzzer, Atheris, Jazzer — unknown. Models: unknown.\n\n## 74. FuzzCoder: Code Large Language Model-Based Fuzz Testing for Industrial IoT Programs\n\n- **Method.** Code-LLM-based fuzzing for industrial IoT programs; the publisher page confirms the article but does not expose enough text here to reconstruct its pipeline safely.\n- **Motivation.** Industrial IoT software mixes protocol constraints and safety-critical behavior, which makes random malformed inputs ineffective.\n- **Dataset + shape.** Abstract-only.\n- **Evaluation results.** Abstract-only.\n- **Concept applicability.** Plausibly high. Protocol grammar, device mode, safety guard, and dangerous command/value combinations are the relevant concepts. Do not cite this as evidence for a particular mechanism until the full paper is retrieved.\n- **Evidence.** Abstract-only. [IEEE article](https://ieeexplore.ieee.org/document/11028927/)\n- **Artifacts (checked 2026-09-29).** Code: verified source [github.com/weimo3221/FuzzCoder](https://github.com/weimo3221/FuzzCoder) (Modified AFL (C) + Python LLM mutation + FuzzInstruct data, 94.7 MB, last push 2025-02; linked from arXiv preprint 2409.01944). Dataset: FuzzInstruct + Fuzz-Bench (nm, readelf, objdump, xmllint, mp3gain, ImageMagick, tiffsplit, jpegtran) — released by authors [github.com/weimo3221/FuzzCoder/tree/main/dataset](https://github.com/weimo3221/FuzzCoder/tree/main/dataset). Models: StarCoder-2-7B, StarCoder-2-15B, CodeLlama-7B, DeepSeek-Coder-7B, CodeQwen-7B, CodeShell-7B.\n\n## 75. A Survey of Coverage-Guided Greybox Fuzzing with Deep Neural Models\n\n- **Method.** Survey and taxonomy of neural assistance at three fuzzing stages: seed generation, seed selection, and seed mutation. It frames coverage-guided fuzzing as an optimization problem and discusses LLM and neurosymbolic directions.\n- **Motivation.** Existing surveys split by technique or application and do not organize how neural architectures affect the three operational fuzzing stages.\n- **Dataset + shape.** Literature survey; no evaluation dataset and no new fuzzer.\n- **Evaluation results.** No experimental comparison. It identifies unresolved issues: semantically invalid seeds, computational cost, weak transfer across domains, limited interpretability, and inadequate benchmarks.\n- **Concept applicability.** Strong design guidance. Use concepts as a validity and priority signal at all three stages: generate inputs consistent with a concept, prefer seeds that satisfy more of it, then mutate the fields the concept names. The survey’s warning about invalid seeds argues for an executable checker.\n- **Evidence.** Full text. [Open-access PDF](https://research-management.mq.edu.au/ws/portalfiles/portal/505591395/504850412.pdf)\n- **Artifacts (checked 2026-09-29).** Code: none found (Survey; no tool). Dataset: N/A (survey; paper states 'No data was used') — not released. Models: none (no experiments).\n\n## 76. Enhancing Differential Testing with LLMs for Testing Deep Learning Libraries\n\n- **Method.** DLLens uses an LLM to synthesize an alternative implementation for a TensorFlow or PyTorch API, statically extracts path constraints from both implementations, and generates inputs that make the two implementations disagree when one is faulty.\n- **Motivation.** Differential testing needs both a valid counterpart and diverse valid inputs. Existing DL-library tools struggle with both.\n- **Dataset + shape.** 1,862 TensorFlow APIs and 1,121 PyTorch APIs were selected. The main comparison samples 200 APIs; the artifact releases API lists, counterparts, path-constraint tooling, and confirmed-bug CSVs.\n- **Evaluation results.** DLLens synthesized counterparts for 1.84x as many APIs as the prior technique, covered 7.23% more branches under the same budget, and found 1.88x as many bugs on the 200-API sample. It reported 71 bugs, 59 developer-confirmed; 46 were previously unknown and 10 of those were fixed.\n- **Concept applicability.** Excellent. The concept can be the semantic relation between source API and counterpart plus the joint path constraints. This turns concept guidance into a checkable differential oracle, far closer to fault exposure than TestEval line targeting.\n- **Evidence.** Full text/artifact. [Official artifact](https://github.com/maybeLee/DLLens); [paper manuscript](https://arxiv.org/abs/2406.07944)\n- **Artifacts (checked 2026-09-29).** Code: verified source [github.com/maybeLee/DLLens](https://github.com/maybeLee/DLLens) (Python tool (codes/: counterpart, constraints, mutation) + RQ notebooks, 10 MB, last push 2025-08). Dataset: TensorFlow 2.10 (1,862 APIs) + PyTorch 2.1 (1,121 APIs); API lists + confirmed-bug CSVs in repo — released by authors [github.com/maybeLee/DLLens](https://github.com/maybeLee/DLLens). Models: gpt-4o-mini.\n\n## 77. Directed Greybox Fuzzing via Large Language Model\n\n- **Method.** HGFuzzer converts target-path constraints into LLM code-generation tasks that create a harness and reachable inputs; it also synthesizes target-function-specific mutators.\n- **Motivation.** Directed greybox fuzzers waste effort on path explosion and random mutation before reaching a known target location or vulnerability condition.\n- **Dataset + shape.** 20 real-world vulnerabilities, with a separate search for new vulnerabilities.\n- **Evaluation results.** HGFuzzer triggered 17 of the 20 known vulnerabilities, 11 within one minute, with at least 24.8x speedup over the compared directed fuzzers. It also found nine new vulnerabilities, all assigned CVEs.\n- **Concept applicability.** Excellent. This is the closest fuzzing analogue of target-specific symbolic concepts: path predicates and the target function determine the harness, valid input construction, and mutator. A direct ablation is raw target location versus extracted guard/data-flow concept.\n- **Evidence.** Full text. [arXiv manuscript](https://arxiv.org/abs/2505.03425)\n- **Artifacts (checked 2026-09-29).** Code: verified source [zenodo.org/records/15553671](https://zenodo.org/records/15553671) (Zenodo HGFuzzer.7z 240 MB: src/main/*.py (harness_gen, mutator_gen, call_chains_analyze), per-CVE outputs; published 2026-07, not linked in arXiv). Dataset: 20 CVEs in 9 C/C++ libs (libming, libpng, libjpeg-turbo, lcms, libxls, libzip, libgd, cjson, libmodbus) — released by authors [zenodo.org/records/15553671](https://zenodo.org/records/15553671). Models: Claude-3.5-Sonnet.\n\n## 78. Low-Cost and Comprehensive Non-textual Input Fuzzing with LLM-Synthesized Input Generators\n\n- **Method.** G2FUZZ asks an LLM to generate and mutate Python input generators rather than producing binary inputs directly. AFL++ then performs local mutations on the generator output. LLM calls are reserved for global jumps in the search space.\n- **Motivation.** Most fuzzing targets consume non-textual formats, and direct LLM generation of images, video, and PDFs is slow, expensive, and often invalid. The paper reports that 73% of analyzed FuzzBench programs take non-textual inputs.\n- **Dataset + shape.** Programs from UNIFUZZ, FuzzBench, and MAGMA, across TIFF, MP4, and PDF formats. The paper evaluates coverage and bug finding across these platforms.\n- **Evaluation results.** G2FUZZ outperformed AFL++, Fuzztruction, and FormatFuzzer on coverage and bug finding across most tested programs. It found ten unique bugs in current real-world software; three received CVEs.\n- **Concept applicability.** High. Treat a concept as a generator specification: required chunk types, cross-field constraints, checksum/length relation, feature combination, and target parser state. Generating a small program from this spec is more inspectable and reusable than asking for one opaque binary input.\n- **Evidence.** Full text. [USENIX Security PDF](https://www.usenix.org/system/files/usenixsecurity25-zhang-kunpeng.pdf); [official artifact](https://github.com/G2FUZZ/G2FUZZ)\n- **Artifacts (checked 2026-09-29).** Code: verified source [github.com/G2FUZZ/G2FUZZ](https://github.com/G2FUZZ/G2FUZZ) (AFL++ fork + program_gen.py/generator_mutation.py, 3.4 MB, last push 2025-11; also Zenodo 14728879). Dataset: UNIFUZZ, FuzzBench, MAGMA + experiment data repo G2FUZZ-DATA (665 MB) — released by authors [github.com/G2FUZZ/G2FUZZ-DATA](https://github.com/G2FUZZ/G2FUZZ-DATA). Models: GPT-3.5, GPT-4, Llama-3-8B-Instruct, Llama-3-70B-Instruct.\n\n## 79. Test Oracle Automation in the Era of LLMs\n\n- **Method.** Survey/roadmap covering assertion, exception, contract, metamorphic, and temporal oracles; it reviews static and dynamic oracle derivation, then examines how LLMs change generation and validation.\n- **Motivation.** Test generation without correct, complete assertions cannot reliably detect regressions. LLMs can express likely intended behavior but can also hallucinate unsupported oracles and inherit training-data leakage.\n- **Dataset + shape.** Survey/roadmap. No new evaluation dataset or benchmark score.\n- **Evaluation results.** No new tool evaluation. The paper identifies oracle accuracy, false positives, uncertainty/validation, formalism choice, and leakage as central research problems.\n- **Concept applicability.** High for the assertion layer. A concept should be a candidate invariant/postcondition tied to a source of authority: documentation, reference implementation, differential counterpart, or observed metamorphic relation. Reject concepts that cannot be validated against one of those sources.\n- **Evidence.** Full text. [Author arXiv manuscript](https://arxiv.org/abs/2405.12766); [TOSEM DOI](https://doi.org/10.1145/3715107)\n- **Artifacts (checked 2026-09-29).** Code: none found (position/roadmap paper, no tool). Dataset: n/a: 6-page SE 2030 position paper, no experiments (illustrative ChatGPT-3.5 examples only) — not released. Models: none (no experiments).\n\n## 80. Agentic Penetration Testing using Secure Shell: Context-Aware Command Generation and Analysis Using Open-Source LLMs\n\n- **Method.** Agentic SSH-based penetration testing with context-aware command generation and analysis. The full pipeline cannot be reconstructed safely from the primary landing page alone.\n- **Motivation.** Penetration-test workflows require adapting commands to host state and interpreting outputs instead of issuing a fixed scan script.\n- **Dataset + shape.** Abstract-only.\n- **Evaluation results.** Abstract-only.\n- **Concept applicability.** Moderate to high for security testing: host facts, privilege level, reachable service, credential state, exploit precondition, and expected evidence can form an explicit concept state. Apply only in authorized sandbox environments.\n- **Evidence.** Abstract-only. [IEEE DOI](https://doi.org/10.1109/CYBER-AI66431.2025.11233438)\n- **Artifacts (checked 2026-09-29).** Code: none found (no repo found (paper page, GitHub search, author accounts)). Dataset: unnamed vulnerable website + custom pentest command-generation prompts (fuzz-score comparison) — not released. Models: CodeGemma-7B-Instruct, CodeLlama, Mistral.\n\n## Inaccessible or incomplete full text\n\nNo accessible full text in this pass: 65, 68, 72, 73, 74, 80. Their notes intentionally remain abstract-only.\n\nAccessible full text but I did not transcribe a verified numeric table: 64 and 71. Their notes state that limitation rather than guess from graphs.\n"}, {"id": "batch-05", "label": "Batch 5", "range": "#81-100", "markdown": "# Full-text notes: catalog #81-100\n\nReviewed 2026-09-18. “Full text” means an author manuscript, arXiv PDF, ACL PDF, or openly hosted paper was read. “Abstract-only” means the publisher page or record was accessible but not a full paper; no unreported dataset size or result is inferred.\n\n## 81. Efficient Fairness Testing in Large Language Models: Prioritizing Metamorphic Relations for Bias Detection (2025)\n\n**Method.** The paper ranks fairness metamorphic relations (MRs) by sentence diversity before executing them. The aim is to run the MRs most likely to expose a demographic-output inconsistency before the budget is exhausted.\n\n**Motivation.** Fairness MRs combine quickly; testing all of them is impractical.\n\n**Dataset and shape.** The accessible manuscript evaluates two language models with fairness MRs. I did not find a stable public count of prompts, relation instances, or protected-attribute groups in the source inspected.\n\n**Evaluation.** Diversity ranking improves fault detection by 22% over random and 12% over distance-based ranking; it reduces time to first failure by 15% and 8%, respectively, and stays within 5% of fault-based prioritization.\n\n**Concept applicability.** High. Treat a concept as an MR plus its source-to-follow-up transformation and rank concepts by predicted fault yield. This is a direct route from a symbolic concept to a test budget policy.\n\n**Evidence.** Abstract-only; [primary arXiv record](https://arxiv.org/abs/2505.07870).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/G-Suavis/MR-Prioritization-LLMs](https://github.com/G-Suavis/MR-Prioritization-LLMs) (2 small Python scripts (diversity metrics, ranking) + MRs.zip, 236 KB, pushed 2024-11; first-author repo, paper shorturl blocked (403)). Dataset: 500 GPT-4-generated prompts with sensitive attributes, MR1-MR11; source/follow-up cases in MRs.zip — released by authors [github.com/G-Suavis/MR-Prioritization-LLMs](https://github.com/G-Suavis/MR-Prioritization-LLMs). Models: GPT-4 ('GPT-4.0'), Llama-3-70B-chat ('LLaMA-70B-chat').\n\n## 82. ASSURE: Metamorphic Testing for AI-powered Browser Extensions (2025)\n\n**Method.** ASSURE combines a modular test generator, isolated browser execution, and validation rules for consistency, metamorphic relations, security boundaries, content alignment, and performance. It uses both metamorphic and adversarial generation strategies.\n\n**Motivation.** AI browser extensions are stateful and nondeterministic, and their behavior depends on both page content and browser context. Exact-output oracles are often unavailable.\n\n**Dataset and shape.** Six widely used AI browser extensions; the paper reports 1,000 metamorphic tests per extension.\n\n**Evaluation.** ASSURE reports 531 distinct issues, 6.4x the testing throughput of manual testing, and a mean 12.4 minutes to detect critical security vulnerabilities.\n\n**Concept applicability.** High for browser/security work. Encode a page transformation, security-boundary hypothesis, and invariant as the concept; generate the paired pages and let the validation pipeline act as the oracle.\n\n**Evidence.** Full text; [primary arXiv PDF](https://arxiv.org/pdf/2507.05307).\n\n**Artifacts (checked 2026-09-29).** Code: link dead [anonymous.4open.science/r/ASSURE-5D33](https://anonymous.4open.science/r/ASSURE-5D33) (anonymous repo returns repository_expired; no de-anonymized repo found). Dataset: 6 AI browser extensions (Sider, Merlin, Immersive Translate, OpenAI Translator, QuillBot, ProWritingAid); synthetic web page templates — not released. Models: none named (SUTs are 6 LLM-powered extensions).\n\n## 83. FLAG: Finding Line Anomalies in RTL Code with Generative AI (2025)\n\n**Method.** FLAG regenerates each RTL source line with an LLM, compares the original and generated lines, then ranks deviations using lexical and contextual features. It localizes likely defects without simulation, synthesis, test benches, or manually specified properties.\n\n**Motivation.** RTL defect localization is expensive when a design is incomplete or lacks a working test environment.\n\n**Dataset and shape.** 120 real-world RTL bugs and 81 synthetic bugs are reported for the 2025 RTL version.\n\n**Evaluation.** The paper reports 38/120 real-world bugs and 32/81 synthetic bugs found. These are localization/detection results, not generated-test coverage.\n\n**Concept applicability.** Indirect but useful. FLAG can propose an anomaly concept, such as an unexpected assignment or missing condition; a downstream generator could turn that concept into a property, assertion, or directed testbench.\n\n**Evidence.** Full text; [primary author manuscript](https://arxiv.org/pdf/2306.12643) and [2025 journal record](https://doi.org/10.1145/3736411). The manuscript is an earlier version, so the 2025 counts above are cross-checked against the journal abstract/record.\n\n**Artifacts (checked 2026-09-29).** Code: verified source [zenodo.org/records/8012211](https://zenodo.org/records/8012211) (Zenodo flag.zip 259 MB: FLAG generation.py/evaluation.py, bug corpora, LLM outputs; 2023 arXiv version only). Dataset: 2023: 121 bugs C/Python/Verilog; 2025 TODAES: 120 real + 81 synthetic RTL bugs (CirFix, HW CWEs, HackAtDAC21, OpenTitan) — partially released [zenodo.org/records/8012211](https://zenodo.org/records/8012211). Models: code-davinci-002, gpt-3.5-turbo.\n\n## 84. CKGFuzzer: LLM-Based Fuzz Driver Generation Enhanced By Code Knowledge Graph (2025)\n\n**Method.** CKGFuzzer builds an interprocedural code knowledge graph over repository entities and API relations. An LLM agent queries that graph to generate, compile-repair, and refine fuzz drivers and seeds; crash reports are also fed into analysis.\n\n**Motivation.** Manual fuzz-driver construction and API understanding limit fuzzing of large libraries.\n\n**Dataset and shape.** Eight open-source software projects.\n\n**Evaluation.** It reports 8.73% average coverage improvement over the stated baselines, 84.4% less manual crash-review work, and 11 real bugs, nine previously unreported.\n\n**Concept applicability.** Very high. A concept can be a graph-grounded API path: entry API, required object state, argument constraints, and target sink. This is closer to usable fuzz-driver context than flat AST tags.\n\n**Evidence.** Full text; [primary arXiv PDF](https://arxiv.org/pdf/2411.11532) and [official artifact](https://github.com/security-pride/CKGFuzzer).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/security-pride/CKGFuzzer](https://github.com/security-pride/CKGFuzzer) (Python agent (fuzzing_llm_engine: fuzzing.py, rag, roles, 8 project configs), 29 MB, last push 2025-02). Dataset: 8 OSS-Fuzz libraries: c-ares, cjson, curl, lcms, libpcap, libtiff, libvpx, zlib — public benchmark only. Models: DeepSeek-V2-Coder, DeepSeek-V2-Chat, BAAI/bge-small-en-v1.5 (embeddings).\n\n## 85. Your Fix Is My Exploit: Enabling Comprehensive DL Library API Fuzzing with Large Language Models (2025)\n\n**Method.** DFUZZ gives the LLM a white-box view of deep-learning APIs, asks it to infer error-triggering edge cases, transfers those cases to related APIs, and synthesizes executable API test programs.\n\n**Motivation.** TensorFlow and PyTorch expose thousands of APIs with complex input constraints; generic fuzzers miss API-specific edge cases.\n\n**Dataset and shape.** The evaluation targets TensorFlow and PyTorch APIs. The accessible source describes libraries with more than 1,000 APIs but I did not recover a defensible exact number of evaluated APIs from the full text during this batch.\n\n**Evaluation.** DFUZZ found 37 bugs; eight were fixed and 19 were under developer investigation when reported. It also reports higher API coverage than its named baselines.\n\n**Concept applicability.** Very high. The reusable concept is an API edge-case schema: dtype, shape, rank, boundary value, parameter interaction, and expected failure mode. This is a strong template for concept-guided input generation.\n\n**Evidence.** Full text; [primary arXiv PDF](https://arxiv.org/pdf/2501.04312).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/DFUZZ-ICSE/DFUZZ](https://github.com/DFUZZ-ICSE/DFUZZ) (Python (edge_case_extraction, gen_program, get_api_reference) + bug reports, 5.4 MB, last push 2024-12). Dataset: PyTorch 1.12/2.2.1 + TensorFlow 2.10/2.15 APIs (TitanFuzz/FuzzGPT API set); API lists, edge cases, bugs in repo — released by authors [github.com/DFUZZ-ICSE/DFUZZ](https://github.com/DFUZZ-ICSE/DFUZZ). Models: gpt-3.5-turbo-1106, Llama-2-7B-chat, Llama-2-70B-chat.\n\n## 86. The Seeds of the FUTURE Sprout from History: Fuzzing for Unveiling Vulnerabilities in Prospective Deep-Learning Libraries (2025)\n\n**Method.** FUTURE mines historical bug-reproduction code from established DL libraries, learns mappings between old and prospective-library APIs, then converts the old bug seeds into tests for the new library. It also transfers discoveries back toward the established library.\n\n**Motivation.** New DL libraries have sparse documentation, few existing tests, and little historical bug knowledge, while their APIs borrow ideas from mature libraries.\n\n**Dataset and shape.** Three prospective DL libraries, 452 targeted APIs, and historical bug code from established libraries. The evaluated targets include Apple MLX, MindSpore, and OneFlow.\n\n**Evaluation.** FUTURE reports 148 bugs across the 452 APIs, 142 previously unknown; 10 received CVE IDs. It also found seven PyTorch bugs.\n\n**Concept applicability.** Very high. “Historical vulnerability pattern + cross-library API mapping” is a concept representation with a natural oracle: transferred seed should trigger the analogous erroneous behavior. It is more fault-directed than line coverage.\n\n**Evidence.** Full text; [primary arXiv PDF](https://arxiv.org/pdf/2412.01317) and [official artifact](https://github.com/Redempt1onzzZZ/FUTURE).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/Redempt1onzzZZ/FUTURE](https://github.com/Redempt1onzzZZ/FUTURE) (bug spider, codepair gen, LoRA finetune scripts, gen/convert notebooks, detected bugs; 2.4 MB, last push 2025-12 (paper URL Redmept1on/FUTURE redirects)). Dataset: MLX, MindSpore, OneFlow (452 APIs); 1,530 TF/PyTorch historical bug codes; bug CSVs released, 600k finetune set not — partially released [github.com/Redempt1onzzZZ/FUTURE](https://github.com/Redempt1onzzZZ/FUTURE). Models: CodeLlama-13B (LoRA fine-tuned), gpt-3.5-turbo (TitanFuzz baseline).\n\n## 87. Towards Leveraging LLMs to Generate Abstract Penetration Test Cases from Software Architecture (2026)\n\n**Method.** The authors define an Abstract Penetration Test Case (APTC) metamodel, derive fields that are available in architecture models, and compare prompting strategies for generating APTCs from those models.\n\n**Motivation.** Security feedback often arrives after design decisions harden into implementation. Architecture models can expose attack surfaces earlier, but architects rarely receive testable security guidance.\n\n**Dataset and shape.** Architecture-model evaluation cases are used, but the accessible paper does not state a single dataset cardinality in the abstract. I did not infer one.\n\n**Evaluation.** The best setting reaches 93% usefulness and 86% correctness, assessed for the generated APTCs.\n\n**Concept applicability.** High, but upstream of executable test generation. The APTC fields can become concepts: asset, trust boundary, entry point, threat, precondition, and test action. Implementation-level generators still need code and environment context.\n\n**Evidence.** Full text; [primary arXiv PDF](https://arxiv.org/pdf/2603.23698).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [zenodo.org/records/19170498](https://zenodo.org/records/19170498) (Zenodo zip 30 MB: Java LLM pipeline (edu.kit.llm) + Palladio runner + GPT/Gemini results; paper DOI zenodo.15921823 points to unrelated LLM4MC record). Dataset: 3 Palladio (PCM) case studies (ABAC-Banking, PowerGrid, Maintenance), 5 CAWEs; models + results in Zenodo — released by authors [zenodo.org/records/19170498](https://zenodo.org/records/19170498). Models: GPT-5.2, Gemini-3-Pro.\n\n## 88. Test Case Generation Using Large Language Models: A Systematic Literature Review (2026)\n\n**Method.** Systematic literature review of LLM-based test-case generation.\n\n**Motivation.** The field has fragmented across unit testing, fuzzing, prompt engineering, repair, and evaluation.\n\n**Dataset and shape.** The review corpus and screening counts were not available in an open full text during this batch.\n\n**Evaluation.** A review, not a test-generation evaluation. No performance claim is recorded here.\n\n**Concept applicability.** Background only. Use it to trace taxonomies and primary papers, not as evidence that a concept design works.\n\n**Evidence.** Abstract-only; [primary DOI](https://doi.org/10.1007/s10586-026-06021-z). Full text was inaccessible from the publisher at review time.\n\n**Artifacts (checked 2026-09-29).** Code: none found (SLR, no tool; paper states code 'Not applicable'). Dataset: 38 primary studies (2020-2025), no dataset released — not released. Models: none (no experiments).\n\n## 89. MultiFileTest: A Multi-File-Level LLM Unit Test Generation Benchmark and Impact of Error Fixing Mechanisms (2026)\n\n**Method.** MultiFileTest packages repository context into multi-file unit-test tasks and evaluates generation together with mechanisms for fixing generated-test errors.\n\n**Motivation.** Single-function benchmarks hide dependency resolution, imports, configuration, and cross-file behavior that determine whether a repository test runs.\n\n**Dataset and shape.** 60 real repositories: 20 Python, 20 Java, and 20 JavaScript projects; 2,389 tasks are stated in the paper’s benchmark description.\n\n**Evaluation.** The paper compares multi-file context and repair mechanisms. Exact aggregate result numbers need table-level extraction from the ACL PDF; this batch does not quote them because the accessible text extraction was incomplete.\n\n**Concept applicability.** High. Concepts should include dependency paths, construction protocol, imported symbols, and cross-file state, not only local path constraints. This benchmark is a better stress test than TestEval for a repository-aware concept representation.\n\n**Evidence.** Full text; [primary ACL PDF](https://aclanthology.org/2026.findings-acl.1403.pdf).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/YiboWANG214/ProjectTest](https://github.com/YiboWANG214/ProjectTest) (Gen/self-fix/eval scripts + dataset, 12 MB, push 2025-05; repo of arXiv predecessor ProjectTest (2502.06556), not linked in ACL PDF). Dataset: MultiFileTest: 20 Python + 20 Java + 20 JS multi-file projects — released by authors [huggingface.co/datasets/yibowang214/MultiFileTest](https://huggingface.co/datasets/yibowang214/MultiFileTest). Models: GPT-4 Turbo, GPT-3.5 Turbo, OpenAI o1, GPT-5 Mini, Gemini 2.0 Flash Experimental, Gemini 3.0 Pro, Claude 3.5 Sonnet, CodeQwen1.5-7B-Chat, DeepSeek-Coder-6.7B-Instruct, CodeLlama-7B-Instruct, CodeGemma-7B-IT.\n\n## 90. BenjiTest: An Agentic Framework for Evaluating LLM-Based Unit Test Generation and Correction (2026)\n\n**Method.** BenjiTest frames test generation and correction as an agentic workflow that evaluates generated unit tests and applies correction steps.\n\n**Motivation.** A generated test is only useful after it compiles, executes, and has a defensible oracle; one-shot outputs leave too many failures untreated.\n\n**Dataset and shape.** The SSRN record exposes a 50-page manuscript, but the accessible metadata did not expose the benchmark composition or counts without downloading through the SSRN gated flow.\n\n**Evaluation.** Result tables were not available in the accessible source. No numbers are asserted here.\n\n**Concept applicability.** Plausibly high. A concept state can persist across generator, executor, and repair agents, but this needs verification from the manuscript before citing it as a specific design precedent.\n\n**Evidence.** Abstract-only; [primary SSRN record](https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6843084). Full PDF was inaccessible in this environment.\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/lopsandrea/jss-benjitest-2026](https://github.com/lopsandrea/jss-benjitest-2026) (Python pkg benjitest/ (58 .py) + 331 tests, prompts, configs, analysis scripts, 24 MB, push 2026-09; README cites the paper (JSS)). Dataset: Classes2Test (147,473 classes) + Defects4J v3.0.1 (835 bugs) + memorization control corpus — released by authors [github.com/lopsandrea/jss-benjitest-2026/tree/main/data](https://github.com/lopsandrea/jss-benjitest-2026/tree/main/data). Models: gpt-4.1, gpt-4o-mini, o3, o4-mini, gemini-1.5-pro, gemini-2.5-pro, deepseek-r1, grok-3, llama3.1:70b.\n\n## 91. Retry and Refine: A Multi-agent Framework for LLM Based Reliable Unit Test Generation (2025)\n\n**Method.** Multi-agent generation with structured retries, validation, and feedback-guided regeneration; the accessible abstract also mentions an ablation on expected-output feedback.\n\n**Motivation.** LLM-produced unit tests need a developer-like refinement cycle rather than an accept-or-discard decision.\n\n**Dataset and shape.** Not recoverable from the publisher metadata available in this batch.\n\n**Evaluation.** The accessible source says expected-output feedback reduced retry depth and improved convergence, but did not expose numeric tables.\n\n**Concept applicability.** High in design terms. Persist the concept and update only the evidence layer after each failure: compiler error, runtime error, unmet path, or failed oracle. This avoids re-prompting from scratch.\n\n**Evidence.** Abstract-only; [primary Springer chapter record](https://doi.org/10.1007/978-3-032-11402-0_7). Full chapter required publisher access.\n\n**Artifacts (checked 2026-09-29).** Code: none found (No link on Springer page; GitHub search (title, author Tanmay Ghosh) found nothing). Dataset: MBPP, HumanEval — public benchmark only. Models: GPT-4o-mini, DeepSeek-V3.\n\n## 92. Intelligent Test Case Generation Method for Fuzzing IoT Protocols Based on LLM (2025)\n\n**Method.** LIPFuzzer asks an LLM to parse protocol knowledge, classify message fields, choose mutation fields, and mutate real protocol messages. It targets Modbus-TCP, MQTT, and CoAP implementations.\n\n**Motivation.** Protocol fuzzing usually demands detailed manual format knowledge and struggles to make targeted mutations in stateful message formats.\n\n**Dataset and shape.** Several implementations of Modbus-TCP, MQTT, and CoAP. The accessible full text did not yield a reliable total implementation/message count in this pass.\n\n**Evaluation.** It reports more convenient and efficient test generation and better vulnerability discovery than Peach, but I did not extract a result table whose counts can be quoted safely.\n\n**Concept applicability.** Very high. A concept can be protocol state plus field semantics, mutation legality, checksum/length dependencies, and target behavior. This is nearly the same representation problem as structured test-input synthesis.\n\n**Evidence.** Full text; [primary open manuscript PDF](https://assets-eu.researchsquare.com/files/rs-6331846/v1_covered_cd29b2d6-2a8a-468e-b159-411b48c9313d.pdf). The catalog DOI points to the later journal version.\n\n**Artifacts (checked 2026-09-29).** Code: none found (No code link in preprint; journal DAS says only 'Data is provided within the related files'; GitHub 'lipfuzzer' hit is unrelated NDSS'19 tool). Dataset: Public targets: MOD_RSSIM 8.2.0 (Modbus-TCP), Mosquitto 1.5.8 (MQTT), libcoap 4.3.1 (CoAP); seed messages not released — public benchmark only. Models: GLM-4.\n\n## 93. CITYWALK: Enhancing LLM-Based C++ Unit Test Generation via Project-Dependency Awareness and Language-Specific Knowledge (2025)\n\n**Method.** CITYWALK uses program dependence analysis to retrieve project dependencies and augments GPT-4o with C++-specific knowledge drawn from documentation and observed failure patterns.\n\n**Motivation.** C++ tests fail for reasons local-method prompts omit: pointers, templates, virtual dispatch, builds, mocks, and nonlocal dependencies.\n\n**Dataset and shape.** Eight popular C++ projects in the arXiv version. The later journal page describes ten, so the final-version count should be verified before paper citation.\n\n**Evaluation.** The accessible full paper states that CITYWALK outperforms prior methods, but this note does not quote deltas until the journal tables are reconciled with the arXiv version.\n\n**Concept applicability.** High. A usable concept representation must include dependency closure, ownership/lifetime assumptions, build/framework requirements, and language-specific hazards. CITYWALK is a direct precedent for expanding concepts beyond control flow.\n\n**Evidence.** Full text; [primary author PDF](https://zhangyw.work/file/papers/Zhang2025TOSEM_B.pdf) and [primary arXiv record](https://arxiv.org/abs/2501.16155).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [zenodo.org/records/14022506](https://zenodo.org/records/14022506) (Zenodo CREAM.zip 4.7 MB (2024-11): Python src (run/analyzer/rag_module/evaluator), prompt templates, FAISS doc index; predates v2). Dataset: 10 public C++ GitHub projects (hjson-cpp, tinyxml2, yaml-cpp, re2, ninja, leveldb, json.cpp, glomap, papy, mlx), 1288 focal methods — partially released [zenodo.org/records/14022506](https://zenodo.org/records/14022506). Models: GPT-4o, gpt-3.5-turbo-0125, DeepSeek-V3, CodeGeeX4-9B.\n\n## 94. YATE: The Role of Test Repair in LLM-Based Unit Test Generation (2025)\n\n**Method.** YATE repairs initially invalid LLM-generated Java tests using rule-based static analysis and re-prompting. Repaired tests become retained tests and potential seeds for further generation.\n\n**Motivation.** Discarding an invalid test wastes a candidate that may already exercise valuable program logic.\n\n**Dataset and shape.** Six open-source projects.\n\n**Evaluation.** Versus a plain LLM method, YATE covers 32.06% more lines and kills 21.77% more mutants. Against HITS, SYMPROMPT, TestSpark, and CoverUp it reports 22% higher line coverage, 20% higher branch coverage, and 20% more mutants killed at comparable LLM-call cost.\n\n**Concept applicability.** High. Preserve the original reachability/fault concept through repair. Feed the repair agent the failed test plus the concept and error evidence, rather than asking it to make a generic test pass.\n\n**Evidence.** Full text; [primary arXiv PDF](https://arxiv.org/pdf/2507.18316).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/michaelkonstantinou/yate-java](https://github.com/michaelkonstantinou/yate-java) (Java/Kotlin impl (98 src files), 324 KB, push 2026-09 + yate-jk-plugin; not linked in arXiv paper; README 'more info coming soon'). Dataset: 6 public Java projects (Binance connector, Chesslib, ConfigMe, Event-ruler, Windward, Batch-processing-gateway) — public benchmark only. Models: GPT-4o-mini, GPT-4.1, DeepSeek-V3, Codestral.\n\n## 95. TestLoter: A Logic-Driven Framework for Automated Unit Test Generation and Error Repair Using LLMs (2025)\n\n**Method.** TestLoter extracts Java AST metadata, prompts with a five-stage logic-driven chain that combines white-box path/condition criteria with boundary-value and equivalence-partition testing, then applies a three-level repair process for syntax, dependencies/compilation, and semantic assertion errors.\n\n**Motivation.** LLM tests often have both low coverage and high error rates; prompt-only generation does not systematically cover control logic or repair dependencies.\n\n**Dataset and shape.** Nine open-source Java projects from data-processing and utility-library domains.\n\n**Evaluation.** 83.6% line coverage, 78.0% branch coverage, and 2.3% failing generated tests. It improves line/branch coverage over ChatUniTest by 8.5%/10.9%; the paper reports more than 10% line and 15% branch coverage gains over EvoSuite.\n\n**Concept applicability.** Very high. Its white-box/black-box prompt fields map cleanly to target-specific concepts: branch condition, boundary relation, equivalence class, and repair status. Our symbolic concept block can replace its generic reasoning stages with program-derived constraints.\n\n**Evidence.** Full text; [primary publisher article](https://doi.org/10.1016/j.cola.2025.101348).\n\n**Artifacts (checked 2026-09-29).** Code: placeholder repo (no real source) [github.com/yyyrf/TestLoter](https://github.com/yyyrf/TestLoter) (Empty repo (0 KB, created 2025-03-30), likely first author's; link from paper unverified (ScienceDirect 403)). Dataset: 9 public Java projects (commons CSV/CLI/Logging/Text, JsonSimple, Base64, NumberToWords, Arrays, Gson per 3rd-party SLR) — public benchmark only. Models: DeepSeek-V3, Llama3 (secondary; per search snippet, unverified).\n\n## 96. Mokav: Execution-driven Differential Testing with LLMs (2025 journal version)\n\n**Method.** Mokav receives two program versions and one equal-output example input. It generates candidate inputs, executes both versions, feeds output and internal execution differences back to the LLM, and stops when it finds a difference-exposing test (DET).\n\n**Motivation.** A coverage-reaching test does not establish a behavioral difference. Program repair, mutation testing, and refactoring validation need inputs that distinguish two implementations.\n\n**Dataset and shape.** 1,535 Python program pairs from Codeforces and 32 pairs from QuixBugs.\n\n**Evaluation.** Mokav finds DETs for 1,255/1,535 Codeforces pairs (81.7%), versus 4.9% for Pynguin and 37.3% for Differential Prompting. The paper attributes the result to iterative, execution-driven feedback.\n\n**Concept applicability.** Extremely high. This is the closest direct template for semantic concept testing: concept = hypothesized behavioral difference; oracle = unequal outputs on buggy/mutant and correct/fixed versions. It can replace structural coverage as the feedback signal.\n\n**Evidence.** Full text; [primary author manuscript PDF](https://www.diva-portal.org/smash/get/diva2%3A1907143/FULLTEXT01.pdf), [official artifact](https://github.com/ASSERT-KTH/mokav), and [journal DOI](https://doi.org/10.1016/j.jss.2025.112571).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/ASSERT-KTH/mokav](https://github.com/ASSERT-KTH/mokav) (Python tool (src/, main.py, scripts, experiments) + data zips, ~1 GB, push 2025-09). Dataset: C4DET: 1,535 Codeforces program pairs + 32 QuixBugs pairs — released by authors [github.com/ASSERT-KTH/mokav/tree/main/data](https://github.com/ASSERT-KTH/mokav/tree/main/data). Models: gpt-3.5-turbo-0125, GPT-4o-2024-05-13, CodeLlama-Instruct-7B, Codestral-2501.\n\n## 97. LSPAI: An IDE Plugin for LLM-Powered Multi-Language Unit Test Generation with Language Server Protocol (2025)\n\n**Method.** LSPAI plugs language-server static analysis into an IDE workflow and passes the resulting semantic context to an LLM for on-demand tests in Java, Go, and Python.\n\n**Motivation.** Per-language test-generation integrations are expensive to build and do not fit developer workflows that need immediate, project-aware tests.\n\n**Dataset and shape.** Evaluation spans Java, Go, and Python projects. The accessible paper excerpt did not expose the number of projects or target methods.\n\n**Evaluation.** Compared with Copilot, it reports line-coverage improvements of 145% for Java, 931% for Go, and 95.62% for Python. These are relative gains, so they should not be compared directly with absolute TestEval coverage.\n\n**Concept applicability.** High for deployment. The language server can supply symbol/type/call-site concepts automatically; combine that with path and fault concepts in the prompt, rather than building language-specific extractors from scratch.\n\n**Evidence.** Full text; [primary author PDF](https://gwihwan-go.github.io/files/papers/FSE-Industry25-LSPAI.pdf) and [official artifact](https://zenodo.org/records/15206535).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [zenodo.org/records/15206535](https://zenodo.org/records/15206535) (VS Code ext TS src (retrieve/generate/lsp/promptBuilder) + eval scripts, Zenodo 2 MB (2025-04); GitHub THU-WingTecher/LSPAI now renamed LSPRAG). Dataset: 6 public projects: Commons-CLI, Commons-CSV (Java), Logrus, Cobra (Go), Black, Crawl4AI (Python); generated tests on Tsinghua cloud — released by authors [cloud.tsinghua.edu.cn/f/c51bd7b4bb894033ac82](https://cloud.tsinghua.edu.cn/f/c51bd7b4bb894033ac82/). Models: GPT-4o, GPT-4o-mini, DeepSeek-V3.\n\n## 98. A System for Automated Unit Test Generation Using Large Language Models and Assessment of Generated Test Suites (2025)\n\n**Method.** AgoneTest automates class-level Java test generation and assessment. It starts from Methods2Test and creates a paired dataset for comparing human and LLM-generated tests, then runs an end-to-end quality assessment workflow.\n\n**Motivation.** Method-level toy evaluations and manual integration do not represent the dependency and scale problems of real test-suite generation.\n\n**Dataset and shape.** A new dataset derived from Methods2Test for human-vs-LLM test comparison. The accessible full text did not provide a safely extractable final count in this batch.\n\n**Evaluation.** The contribution is an automated system, dataset, and assessment methodology. No aggregate result is quoted here because the paper’s tables were not extracted reliably enough for an exact claim.\n\n**Concept applicability.** Moderate to high. It supplies an evaluation framework for whether concept-guided generation produces tests that survive project-level integration, which is more useful than syntax-only measures.\n\n**Evidence.** Full text; [primary arXiv PDF](https://arxiv.org/pdf/2408.07846) and [ICSTW DOI](https://doi.org/10.1109/ICSTW64639.2025.10962454).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/lopsandrea/classes2test](https://github.com/lopsandrea/classes2test) (AgoneTest/ Python framework (agone_test.py, execution_manager, errorCorrection) + outputs, 700 MB, push 2025-09; paper cites anonymous.4open.science/r/classes2test (live)). Dataset: Classes2Test (9,410 repos, derived from Methods2Test) — released by authors [github.com/lopsandrea/classes2test/tree/main/dataset](https://github.com/lopsandrea/classes2test/tree/main/dataset). Models: gpt-4-1106-preview, gpt-3.5-turbo.\n\n## 99. AgentTester: An LLM-Based Tool for Unit Test Generation with Automatically Generated Prompts (2025)\n\n**Method.** AgentTester automatically generates prompts for an LLM-based unit-test tool.\n\n**Motivation.** Prompt construction is a bottleneck for reproducible LLM test generation.\n\n**Dataset and shape.** Not available in the accessible bibliographic record.\n\n**Evaluation.** Not available in the accessible bibliographic record.\n\n**Concept applicability.** Potentially useful as a prompt-construction layer: symbolic concepts could become structured prompt fields. The paper needs full-text inspection before using it as evidence for any claimed effect.\n\n**Evidence.** Abstract-only; [primary Springer DOI](https://doi.org/10.1007/978-981-95-0011-6_10). Full chapter was inaccessible.\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/SkywalkerCHH/AgentTester](https://github.com/SkywalkerCHH/AgentTester) (Python scripts (AutoPrompting, PromptDistillation, ValidationRepair, JaCoCo coverage), 1.6 MB, push 2025-04; cited as ref [20]). Dataset: 3 public Java projects: jInstagram, tabula-java, zappos-json — released by authors [github.com/SkywalkerCHH/AgentTester/tree/main/RepoData](https://github.com/SkywalkerCHH/AgentTester/tree/main/RepoData). Models: GLM-4 (unverified: 3rd-party SLR table; repo also configures glm-zero-preview, deepseek-r1:8b).\n\n## 100. QTRAN: Extending Metamorphic-Oracle Based Logical Bug Detection Techniques for Multiple-DBMS Dialect Support (2025)\n\n**Method.** QTRAN transfers metamorphic-oracle SQL query pairs from one DBMS dialect to another. It identifies dialect-specific features with parsing, queries a feature knowledge base through retrieval, uses an LLM to translate the pair, and mutates transferred queries for further testing.\n\n**Motivation.** Metamorphic DBMS testers depend on manually engineered dialect grammars, so they cover only a few popular systems.\n\n**Dataset and shape.** Eight DBMS dialects are represented in its feature inventory: MySQL, MariaDB, TiDB, PostgreSQL, SQLite, MonetDB, DuckDB, and ClickHouse. The paper evaluates transferred statement pairs and fuzzing outcomes across those dialects.\n\n**Evaluation.** QTRAN found 24 previously unknown logical bugs; 16 were confirmed. The authors also report that most transferred pairs were suitable for metamorphic testing.\n\n**Concept applicability.** Very high. A metamorphic concept can encode the original SQL, relation-preserving transformation, dialect-specific feature mapping, and expected output relation. This is a concrete design for concepts that survive translation across contexts.\n\n**Evidence.** Full text; [primary paper PDF](https://matafeiyanll.github.io/paper/Issta25.pdf) and [official artifact](https://github.com/QTRANll/QTRAN).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/QTRANll/QTRAN](https://github.com/QTRANll/QTRAN) (Python src/ (TransferLLM, DialectMapping, MutationLLM fine-tune), feature KB 29 MB, 26.8 MB repo, last push 2025-12). Dataset: 8 DBMSs (MySQL, MariaDB, TiDB, PostgreSQL, SQLite, MonetDB, DuckDB, ClickHouse); SQL pairs from NoREC/TLP/Pinolo/DQE — released by authors [github.com/QTRANll/QTRAN-BUGLIST](https://github.com/QTRANll/QTRAN-BUGLIST). Models: GPT-4o-mini (gpt-4o-mini-2024-07-18), fine-tuned GPT-4o-mini (mutation LLM).\n\n## Inaccessible full texts\n\n- #88, *Test Case Generation Using Large Language Models: A Systematic Literature Review*: publisher full text inaccessible.\n- #90, *BenjiTest*: SSRN PDF download was gated in this environment.\n- #91, *Retry and Refine*: Springer chapter requires publisher access.\n- #99, *AgentTester*: Springer chapter requires publisher access.\n\nFor #81, #83, #85, #92, #93, and #98, an open manuscript was accessible but some table-level dataset/result details could not be extracted reliably. Those entries deliberately omit those numbers.\n"}, {"id": "batch-06", "label": "Batch 6", "range": "#101-122", "markdown": "# Full-Text Notes, Batch 06 (Catalog #101-#122)\n\n_Read on 2026-09-18. “Full text read” means an open paper or author manuscript was available. “Abstract-only” means the data/result fields deliberately stop at what the primary abstract or official artifact states._\n\n## 101. LLMs in the Heart of Differential Testing: A Case Study on a Medical Rule Engine\n\n**Method.** LLMeDiff asks an LLM to write tests from medical-rule knowledge, then runs each test against two GURI rule-engine implementations; any output disagreement is the oracle.\n\n**Motivation.** Medical rules encode standards and regulations in two independently maintained implementations. Manual agreement testing does not scale, while a public-knowledge model can propose medically meaningful cases.\n\n**Dataset + shape.** 58 real medical rules in the Cancer Registry of Norway's GURI system; two implementations; four LLMs.\n\n**Evaluation results.** Differential execution found inconsistencies in 22 rules, including version-handling differences. GPT-3.5 hallucinated least and produced the highest reported usable-test rate, but took the longest.\n\n**Concept applicability.** Strong. The concept should be a semantic relation between implementations: rule version, input condition, expected equivalence, and the minimal divergent case. This is a clean fault-exposure oracle without needing a hand-written expected result.\n\n**Evidence.** Full text read. Primary source: <https://arxiv.org/abs/2404.03664>\n\n**Artifacts (checked 2026-09-29).** Code: closed / not released (Paper Data Availability: 'Due to confidentiality, we can not disclose the data, scripts, and systems'). Dataset: 58 Cancer Registry of Norway GURI medical rules, 2 rule-engine implementations — not released. Models: Mistral-7B, Llama-2-13B, Mixtral-8x7B, GPT-3.5.\n\n## 102. AutoOracle: High-Quality C++ Test Oracle Generation via Data Quality-Driven and Filtering-Enabled LLMs\n\n**Method.** AutoOracle constructs C++ test-assert pairs by code de-differentiation, scores and filters noisy examples, fine-tunes a C++ oracle model, then filters suspicious generated assertions.\n\n**Motivation.** Tests without trustworthy assertions do not detect faults. Existing oracle generators inherit noisy training pairs and emit plausible-looking but wrong expected values.\n\n**Dataset + shape.** The released AutoOracleDataset has 79,496 prompt/label/quality-score samples from 666 open-source C++ projects. A prompt contains a test prefix plus focal-method definition; the label is an assertion.\n\n**Evaluation results.** The paper abstract reports 2.13x higher oracle accuracy and 52.3% lower error rate than its stated SOTA baseline; it also reports better compile/runtime success in a Samsung embedded SSD-firmware study and a survey of 19 practitioners. Exact split and per-project table values were not accessible.\n\n**Concept applicability.** Strong. A concept record can produce the assertion target: postcondition, invariant, relation between inputs and outputs, and forbidden state. The suspicious-oracle filter is worth copying as a post-generation critic.\n\n**Evidence.** Abstract plus official dataset artifact; publisher full text unavailable. Primary sources: <https://doi.org/10.1145/3786583.3786868>, <https://github.com/SamsungDS/AutoOracleDataset>\n\n**Artifacts (checked 2026-09-29).** Code: data/prompts only, no tool source [github.com/SamsungDS/AutoOracleDataset](https://github.com/SamsungDS/AutoOracleDataset) (Samsung repo has only dataset JSON (train_1/train_2/test) + licenses; no AutoOracle tool/model code; no other SamsungDS repo). Dataset: AutoOracleDataset: 79,496 C++ test-assert pairs from 666 OSS projects; plus Samsung SSD firmware (internal) — partially released [github.com/SamsungDS/AutoOracleDataset](https://github.com/SamsungDS/AutoOracleDataset). Models: unknown (fine-tuned domain LLM; base model not named in accessible sources).\n\n## 103. Leveraging Retrieval-augmented LLMs for Automated Test Case Generation from Software Requirements Specification\n\n**Method.** The system retrieves semantically related SRS chunks using MiniLM embeddings, adds few-shot examples, and asks proprietary or open models to produce structured test cases; a Streamlit interface exposes the pipeline.\n\n**Motivation.** Requirements are broad and domain-specific. A prompt containing the whole SRS mixes irrelevant material with the target requirement.\n\n**Dataset + shape.** 50 SRS-to-test-case pairs across eight domains: education, aerospace, automotive, telecom, e-commerce, government, hotel management, and healthcare. Documents are chunked into 100-200 words; each chunk maps to 2-5 tests. Evaluation uses leave-one-domain-out retrieval/examples.\n\n**Evaluation results.** GPT-4o reached BLEU 0.72 and a 4.8/5 human score. Removing few-shot examples reduced these to 0.45 and 3.6. The paper reports six evaluated models.\n\n**Concept applicability.** Moderate to strong. Retrieve a target-specific concept card, rather than raw document fragments: preconditions, business rule, state transition, boundary, and expected result. The small mixed public/synthetic corpus makes it a method example, not a strong bug-finding benchmark.\n\n**Evidence.** Full text read. Primary source: <https://oaji.net/articles/2025/3603-1766026568.pdf>\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/bondif/srs-to-testcase-generator](https://github.com/bondif/srs-to-testcase-generator) (Minimal: 92-LOC Streamlit RAG app + BLEU/leakage scripts, 9 KB, Zenodo 10.5281/zenodo.17484867, push 2025-10; no SRS data). Dataset: 50 SRS-test case pairs, 8 domains (public SRS + synthetic); only dataset card/metadata shared — not released. Models: GPT-4o, mistral:7b, phi4:14b, deepseek-r1:70b, marco-o1 (in repo app), MiniLM-L6-v2 (embeddings).\n\n## 104. Software Testing with Large Language Models: An Interview Study with Practitioners\n\n**Method.** Qualitative interviews, analyzed with grounded-theory-style thematic analysis, yield a five-step workflow: define objective, prompt, refine, evaluate output, learn from use.\n\n**Motivation.** Teams use LLMs in testing through ad hoc trials; the study asks how testers actually integrate them and where human review remains necessary.\n\n**Dataset + shape.** 15 software testers in diverse roles and domains, interviewed semi-structurally. There is no program/test benchmark.\n\n**Evaluation results.** Participants described iterative prompt refinement and emphasized human validation because hallucination and inconsistent reasoning remain operational risks. The output is a preliminary practice guideline, not a comparative accuracy or coverage claim.\n\n**Concept applicability.** Indirect. It supports exposing the concept record to a tester or critic and recording why a test was accepted, repaired, or rejected. It does not validate a concept extractor by itself.\n\n**Evidence.** Full text read. Primary source: <https://arxiv.org/abs/2510.17164>\n\n**Artifacts (checked 2026-09-29).** Code: none found (Qualitative interview study; no tool). Dataset: 15 practitioner interviews; transcripts not shared (confidentiality), only quotes in paper — not released. Models: none (no experiments).\n\n## 105. LLM-Based Property-Based Test Generation for Guardrailing Cyber-Physical Systems\n\n**Method.** ChekProp first asks an LLM to extract properties from CPS code and documentation, then generates property-based tests that can run before deployment or monitor a deployed system.\n\n**Motivation.** CPS safety needs checks across physical, computational, and communication components, but manually writing both safety properties and generators is expensive.\n\n**Dataset + shape.** Preliminary experiments cover real-world and commonly studied CPS examples, including a pneumatic-control system and a line-following robot. The paper evaluates generated properties against manual ones, executability after minimal edits, and input-space partition coverage; it does not release a large numeric corpus in the manuscript.\n\n**Evaluation results.** The authors conclude that generated properties were comparable to manual properties and that the generated PBTs were executable and covered relevant partitions. The paper presents this as preliminary evidence rather than a broad benchmark score.\n\n**Concept applicability.** Very strong. The extracted property is already a concept: invariant, safe/unsafe state, controllable inputs, and follow-up relation. This points beyond line coverage toward property/fault oracles.\n\n**Evidence.** Full text read. Primary source: <https://arxiv.org/abs/2505.23549>\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/khesoem/ChekProp](https://github.com/khesoem/ChekProp) (Python tool (src/llm, src/tgen, main.py, prompts) + generated PBTs, 341 KB, last push 2025-10). Dataset: 9 CPS Python programs (pneumatic control, temperature control, 7 Raspberry Pi/gpiozero apps) — released by authors [github.com/khesoem/ChekProp/tree/main/examples](https://github.com/khesoem/ChekProp/tree/main/examples). Models: gemini-2.0-flash-lite-preview-02-05.\n\n## 106. A Review of Large Language Models for Automated Test Case Generation\n\n**Method.** Systematic literature review using IEEE Xplore, seed papers, Litmaps, ACM DL, and Scopus; it groups approaches into prompt engineering, feedback-driven generation, fine-tuning/pre-training, and hybrid methods.\n\n**Motivation.** Reported LLM test-generation outcomes are hard to compare because prompts, datasets, metrics, languages, and feedback mechanisms vary widely.\n\n**Dataset + shape.** 84 primary studies published from 2022-2025, selected after screening. This is a review corpus, not executable test data.\n\n**Evaluation results.** The review does not report a unified new model score. Its empirical conclusion is that coverage, mutation score, and compilability are measured inconsistently; many studies use small or narrow benchmarks, and feedback/context/program complexity strongly affect results.\n\n**Concept applicability.** Useful as a taxonomy check. A concept-guided paper should separate extraction, prompting, feedback, and oracle evaluation so it can be compared to these four families. It supplies no direct fault-exposure result.\n\n**Evidence.** Full text read. Primary source: <https://www.mdpi.com/2504-4990/7/3/97>\n\n**Artifacts (checked 2026-09-29).** Code: none found (Literature review (Celik & Mahmoud, MAKE 2025); no tool). Dataset: 84 primary studies (IEEE Xplore, Wang et al. seed set, Litmaps, ACM DL, Scopus) — not released. Models: none (no experiments).\n\n## 107. Can Generative AI Produce Test Cases? An Experience from the Automotive Domain\n\n**Method.** RQM2Text uses retrieval-augmented few-shot prompting to convert informal Rational Quality Manager test steps into executable ecu.test instructions.\n\n**Motivation.** Automotive test plans start as informal behavior descriptions but engineers must later translate them into tool-specific scripts, often with missing or inconsistent context.\n\n**Dataset + shape.** An industrial partner supplied 36 test-specification/script pairs. After cleaning, the benchmark has 200 unique informal-step to executable-instruction pairs; scripts average 4.4 executable instructions. The industrial data remain confidential.\n\n**Evaluation results.** The best configuration achieved 49.5% exact-match rate and 64.5% line-match rate; code-tuned models did better than counterparts, and inaccurate/unneeded context hurt results.\n\n**Concept applicability.** Strong for requirements-driven generation. Convert retrieved context into explicit concepts such as signal, actuator state, CAN mapping, value constraint, and expected observation. The evaluation measures translation fidelity, not bug detection.\n\n**Evidence.** Full text read. Primary source: <https://aisberg.unibg.it/retrieve/889f446d-9d3a-467f-87a7-7ad6a39ea240/2025_FSE_Industy.pdf>\n\n**Artifacts (checked 2026-09-29).** Code: closed / not released (Paper: complete replication package exists but cannot be shared (industrial partner confidentiality, Req. R3)). Dataset: Industrial RQM test specs -> ecu.test scripts (36 spec/script pairs, ~200 step pairs), confidential — not released. Models: gemma-7b, gemma-7b-it, codegemma-7b, codegemma-7b-it, Llama-2-7b, Llama-2-7b-chat, CodeLlama-7b, CodeLlama-7b-Instruct, Mistral-7B-v0.3, Mistral-7B-Instruct-v0.3.\n\n## 108. CoverUp: Effective High Coverage Test Generation for Python\n\n**Method.** CoverUp instruments Python with SlipCover, prompts an LLM using uncovered line/branch information, lets it request extra code context, executes the test, and continues the dialogue after a failure or no coverage improvement.\n\n**Motivation.** A one-shot test prompt has no information about what execution is still missing. Coverage feedback can name the next concrete target.\n\n**Dataset + shape.** Three Python benchmark suites derived from 35 open-source projects. The principal CodaMosa-derived suite contains 4,116 functions; the paper also evaluates a MuTAP-compatible suite.\n\n**Evaluation results.** With GPT-4o, CoverUp achieved median per-module line+branch coverage of 80% versus CodaMosa's 47%; on the MuTAP comparison it reached 89% overall line+branch coverage versus 77%. Ablations attribute the gain to coverage context, code-context access, and continued dialogue, not only the LLM.\n\n**Concept applicability.** Direct. Replace raw uncovered branch text with symbolic path constraints, aliases, state changes, and boundary cases; retain CoverUp's execution loop. This is the closest existing architecture to the current TestEval feedback runner.\n\n**Evidence.** Full text read. Primary source: <https://doi.org/10.1145/3729398>\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/plasma-umass/coverup](https://github.com/plasma-umass/coverup) (Python package (src/coverup: llm, prompt, testrunner...), tests, CI, 2.4 MB, last push 2026-04; also archived on Zenodo). Dataset: CM (CodaMosa suite, 35 projects), PY (84 modules), MT (MuTAP/HumanEval 163 fns) — released by authors [github.com/plasma-umass/coverup-eval](https://github.com/plasma-umass/coverup-eval). Models: GPT-4o (gpt-4o-2024-05-13), Codex (CodaMosa/MuTAP baselines).\n\n## 109. ScenarioFuzz-LLM: Enhancing Diversity in Autonomous Driving Scenario Fuzzing with LLMs\n\n**Method.** The framework combines LLM guidance, RAG, and genetic scenario mutation to diversify autonomous-driving simulations; it measures path, event, traffic-condition, and behavior coverage.\n\n**Motivation.** Traditional ADS scenario fuzzers repeatedly mutate close variants and miss rare combinations of traffic participants, weather, road layout, and timing.\n\n**Dataset + shape.** The artifact includes initial scenarios, results, and detected violations for CARLA 0.9.13 with Autoware and a Behavior Agent. The accessible artifact does not state the paper's final seed count or experimental budget.\n\n**Evaluation results.** The authors report a 35.62% improvement in scenario diversity over their stated SOTA baseline and release unique violation scenarios. Exact fault counts and confidence intervals need the paper PDF.\n\n**Concept applicability.** Strong. A scenario concept should encode road topology, actor roles, event ordering, weather, ego-vehicle objective, and safety predicate. It is a natural extension of symbolic preconditions from scalar inputs to world-state constraints.\n\n**Evidence.** Official artifact/abstract only; paper PDF was not accessible. Primary source: <https://github.com/ldegao/ScenarioFuzz-LLM>\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/ldegao/ScenarioFuzz-LLM](https://github.com/ldegao/ScenarioFuzz-LLM) (Python fuzzer (fuzzer.py, gpt.py, rag_module, metrics) on CARLA 0.9.13/Autoware, 50 MB, last push 2025-12). Dataset: CARLA 0.9.13 + Autoware/Behavior Agent scenarios; seeds, results, violation scenarios — released by authors [drive.google.com/file/d/179mu5w462AwPAI4bms6FHQ1WVwMmxdNy/view](https://drive.google.com/file/d/179mu5w462AwPAI4bms6FHQ1WVwMmxdNy/view). Models: GPT-4-turbo (repo default; paper not verified).\n\n## 110. Automatic High-Level Test Case Generation using Large Language Models\n\n**Method.** The authors collect use-case to high-level-test-case pairs, evaluate GPT-4o/Gemini and fine-tuned LLaMA 3.1 8B/Mistral 7B, then use human review.\n\n**Motivation.** Practitioners reported that aligning testing with business requirements is harder than writing the final test script. High-level cases make the requirement-to-test decision earlier.\n\n**Dataset + shape.** A survey of 26 practitioners motivates a use-case-to-test-case dataset. The accessible full paper describes the task shape but does not expose a reliable dataset cardinality in its abstract/searchable text.\n\n**Evaluation results.** Fine-tuning the two open models improves their generation quality, and a final human survey finds the cases useful. Exact automatic/human scores require table-level extraction from the PDF.\n\n**Concept applicability.** Strong for a requirements setting: business goal, actors, preconditions, alternate flow, boundary, and expected result can be a concept record before executable-test synthesis.\n\n**Evidence.** Full text read; quantitative t
