<script id="data" type="application/json">[{"id": "batch-01", "label": "Batch 1", "range": "#1-20", "markdown": "# Full-text notes: catalog entries 1-20\n\nReviewed 2026-09-18. “Full text” means an official open-access PDF, author manuscript, or conference preprint was available and read. “Abstract-only” means a primary landing page exposed an abstract but no accessible full text was found; those entries deliberately omit unreported dataset sizes and results.\n\n## 1. A Logic-Guided and Explainable Approach to LLM-Based Unit Test Generation (Logic-CoT, 2026)\n\n- **Method.** Logic-CoT converts the CUT's control-flow graph into condition/state vectors and paths, derives satisfying inputs and expected outputs, then fills an Arrange-Act-Assert template. A two-level repair loop fixes syntax locally; assertion failure sends the process back to logical inference.\n- **Motivation.** Direct code-to-test prompting has poor branch reasoning, weak assertions, and unreadable intent. The authors want the model to externalize the route from input constraint to expected outcome.\n- **Dataset + shape.** Java experiments use QuixBugs, Apache Commons Math, Apache Commons Lang, HumanEval-X, and SV-COMP. The accessible article names the corpora but the exact sampled counts should be taken from its experiment tables before reuse.\n- **Evaluation.** The paper compares Logic-CoT with a native LLM and ChatUniTest on effectiveness, repair efficiency, and interpretability. The article reports significant paired improvements but this note does not quote table values not independently transcribed.\n- **Concept applicability.** Very high. Its condition-state table is almost the same object as a target-specific symbolic concept. Keep the explicit guard, alias, path polarity, input relation, and oracle separate so the LLM can inspect them.\n- **Evidence.** Full text, official open-access article: <https://www.mdpi.com/2076-3417/16/5/2542>\n\n## 2. Test Wars: A Comparative Study of SBST, Symbolic Execution, and LLM-Based Approaches to Unit Test Generation (2025)\n\n- **Method.** An empirical comparison of EvoSuite (search-based testing), Kex (symbolic execution), and TestSpark (LLM generation).\n- **Motivation.** Claims that LLMs replace established generators need a direct, controlled comparison on the same Java bugs and metrics.\n- **Dataset + shape.** GitBug Java benchmark. The paper evaluates the three tools against bug-containing real-world Java projects; consult its dataset table for project/method counts before reproducing.\n- **Evaluation.** Coverage, mutation/fault detection, execution, and cost are compared. The study frames LLM generation as complementary rather than universally dominant: classical tools retain strengths on systematic exploration.\n- **Concept applicability.** Medium. Use concept synthesis as the LLM arm, then compare against symbolic constraints and SBST. This paper is a good ablation template, not a concept-extraction method.\n- **Evidence.** Full author PDF: <https://research.tudelft.nl/files/235086533/tga_pipeline_paper.pdf>\n\n## 3. Benchmarking LLMs for Unit Test Generation from Real-World Functions (ULT, 2026)\n\n- **Method.** ULT is a function-level Python benchmark curated for high cyclomatic complexity and reduced test leakage; PLT is its deliberately pre-leaked paired control.\n- **Motivation.** Existing benchmarks can reward memorization and structurally simple code, inflating apparent test-generation ability.\n- **Dataset + shape.** ULT has 3,909 real-world Python functions. Functions were selected through multi-stage curation with a complexity filter; PLT provides leaked counterparts for controlled memorization analysis.\n- **Evaluation.** Across evaluated LLMs on ULT, average test accuracy was 41.32%, statement coverage 45.10%, branch coverage 30.22%, and mutation score 40.21%. The paired TestEval averages reported are 91.79%, 92.18%, 82.04%, and 49.69%, respectively.\n- **Concept applicability.** High. ULT is the right stress test after TestEval: concept blocks need to handle realistic dependencies and semantic difficulty, not only clean LeetCode control flow.\n- **Evidence.** Full accepted manuscript: <https://discovery.ucl.ac.uk/id/eprint/10223971/1/3805043.pdf>\n\n## 4. LLM-Powered Fuzz Testing of Automotive Diagnostic Protocols (2025)\n\n- **Method.** An LLM is taught Unified Diagnostic Services (UDS) structure and constraints, then used to construct a protocol fuzzer that emits semantically valid diagnostic messages. The authors compare it with a commercial fuzzer under different prompts and network configurations.\n- **Motivation.** Automotive fuzzers require protocol and deployment expertise, and generic byte mutation wastes effort on invalid UDS messages.\n- **Dataset + shape.** UDS diagnostic protocol traffic and automotive ECU/network configurations. The accessible paper does not expose a public corpus cardinality in the material reviewed.\n- **Evaluation.** It studies fault/vulnerability detection and generated-byte/action distributions, including chi-square and Shannon entropy analyses, against a commercial fuzzer. Do not claim a bug count without the result tables.\n- **Concept applicability.** High for fuzzing. Protocol fields, session state, service/subfunction constraints, and ECU configuration are precisely the kind of structured concepts that should guide seed generation.\n- **Evidence.** Full author-hosted PDF: <https://mpese.com/publication/mcshane-2025-llm/2025-01-8091.pdf>\n\n## 5. AI-Powered Unit Test Generation via Multi-LLM Chaining (2025)\n\n- **Method.** Gemini generates JUnit tests; GPT-4o refines them for compilation, boundary inputs, assertions, and coverage. Other single-model and chained configurations, including Claude-3.5, are compared.\n- **Motivation.** One-shot tests often compile poorly or miss edge cases. The second model acts as a targeted test editor rather than generating from scratch.\n- **Dataset + shape.** HumanEval tasks translated into JUnit tests. The full paper should be consulted for the exact retained-task count.\n- **Evaluation.** The best reported chain reaches 99.05% branch coverage, 90.48% line coverage, and 94.32% mutation coverage. Randoop reports 68.64% branch and 78.84% line coverage in the same study.\n- **Concept applicability.** High. Put symbolic concepts in both stages: generation receives reachability constraints; refinement receives uncovered constraints and weak-oracle evidence. This is closer to the current feedback loop than a one-shot prompt.\n- **Evidence.** Full open-access IEEE article: <https://ieeexplore.ieee.org/document/11269709/>\n\n## 6. GEM: A Framework for Strengthening LLM-Generated Unit Tests Using Mutation Feedback (2026)\n\n- **Method.** GEM expands to Generate-Execute-Mutate: it uses surviving mutants to strengthen LLM-generated assertions.\n- **Motivation.** Tests that run and cover code can still accept mutant behavior because their oracles are weak.\n- **Dataset + shape.** Abstract-only; no dataset size is recorded here.\n- **Evaluation.** Abstract-only; the public conference record does not provide the experiment table in the accessible material.\n- **Concept applicability.** Very high. Treat the mutant operator, changed expression, behavioral difference, and required distinguishing input as the concept. This is a direct semantic extension of the current TestEval loop.\n- **Evidence.** Abstract-only, official conference page: <https://conf.researchr.org/details/cibse-2026/cibse-2026-cibse-2026--main-track-/27/GEM-A-Framework-for-Strengthening-LLM-Generated-Unit-Tests-Using-Mutation-Feedback->\n\n## 7. OBsmith: LLM-Powered JavaScript Obfuscator Testing (2026)\n\n- **Method.** The framework creates JavaScript sketches with LLMs, fills placeholders with concrete values, instruments a baseline, obfuscates programs under several settings, and differentially compares observable behavior. It also extracts sketches from real programs.\n- **Motivation.** Obfuscators are expected to preserve semantics, but conventional JavaScript fuzzers do not target obfuscation-specific transformations or silent miscompilations.\n- **Dataset + shape.** Generated LLM sketches plus sketches extracted from real JavaScript programs; evaluation covers JS-Confuser and Obfuscator.IO across low/medium/high configurations. The accessible artifact does not give a single total-program count in its README.\n- **Evaluation.** OBsmith found 11 previously unknown correctness bugs in the two obfuscators. Five general JavaScript fuzzers found none under the same program budget.\n- **Concept applicability.** High. The concept should encode a JavaScript feature, an obfuscation transform, and the semantic relation expected to survive it. This is a clean route to metamorphic/differential test generation.\n- **Evidence.** Full arXiv preprint: <https://arxiv.org/pdf/2510.10066>; artifact and bug corpus: <https://github.com/shanjiang98/obsmith>\n\n## 8. Req2Test: An Approach for the Automatic Generation of Unit Tests from User Stories Using LLMs (2026)\n\n- **Method.** Abstract-only in this review. The title and venue identify requirements/user stories as the input to LLM unit-test generation.\n- **Motivation.** Move test generation earlier, from natural-language user stories rather than only code.\n- **Dataset + shape.** Abstract-only; unavailable.\n- **Evaluation.** Abstract-only; unavailable.\n- **Concept applicability.** Medium. Requirement-level concepts could seed a test-intent layer, but they need grounding against implementation-level paths or contracts before driving fault exposure.\n- **Evidence.** Abstract-only, official metadata record: <https://doi.org/10.5281/zenodo.17917984>\n\n## 9. LLM-based Dynamic Differential Testing for Database Connectors with Reinforcement Learning-Guided Prompt Selection (2025)\n\n- **Method.** Parameterized prompts supply database-connector domain knowledge. The LLM generates tests, differential execution compares connector behavior, and reinforcement learning selects prompts using prior behavioral feedback to improve coverage and discrepancy discovery.\n- **Motivation.** Connector defects are stateful and specification-sensitive; generic fuzzing and unguided LLM prompts miss interface/internal logic.\n- **Dataset + shape.** Two production JDBC connectors: MySQL Connector/J and OceanBase Connector/J.\n- **Evaluation.** The authors reported 16 issues: 10 confirmed bugs and 6 acknowledged unsafe implementations.\n- **Concept applicability.** Very high. Connector API sequence, connection state, SQL feature, expected cross-connector relation, and known unsafe behavior form an actionable concept block. The differential oracle avoids needing a hand-written expected result.\n- **Evidence.** Full arXiv manuscript: <https://arxiv.org/pdf/2506.11870>; official ASE record: <https://ieeexplore.ieee.org/document/11334652/>\n\n## 10. A Cascaded Pipeline for Self-Directed, Model-Agnostic Unit Test Generation via LLMs (CasModaTest, 2025)\n\n- **Method.** CasModaTest separately generates a test prefix and a semantically matched oracle, retrieves demonstrations from manually built prefix/oracle pools, assembles the test, executes it, and repairs compilation/runtime errors.\n- **Motivation.** Prior work often generates only an oracle or fails to preserve the semantic connection between setup and assertion; closed-model dependence also limits use.\n- **Dataset + shape.** Defects4J plus 1,625 focal methods from six real-world Java projects.\n- **Evaluation.** On Defects4J it outperforms five prior approaches on accuracy and focal-method coverage. On the six projects it exceeds EvoSuite on method, line, and branch coverage; use the tables for exact deltas.\n- **Concept applicability.** High. The relevant concept should bind input construction to the expected behavioral relation, not appear as loose annotations. This gives a design rule for symbolic concepts: every reachability concept needs an oracle counterpart.\n- **Evidence.** Full author PDF: <https://vinci-grape.github.io/papers/A_Cascaded_Pipeline_for_Self_Directed__Model_Agnostic_Unit_Test_Generation_via_LLMs.pdf>\n\n## 11. GenFair: Systematic Test Generation for Fairness Fault Detection in Large Language Models (2025)\n\n- **Method.** Metamorphic fairness testing combines equivalence partitioning, mutation operators, and boundary-value analysis to create source prompts; metamorphic relations generate demographic follow-ups; tone comparisons flag violations.\n- **Motivation.** Template and grammar approaches miss linguistically diverse, intersectional bias cases.\n- **Dataset + shape.** Generated fairness prompts evaluated against GPT-4.0 and LLaMA-3.0. The accessible manuscript should be used for the exact prompt/mutation inventory.\n- **Evaluation.** Fault-detection rate is 0.73 on GPT-4.0 and 0.69 on LLaMA-3.0, versus 0.54/0.51 for a template baseline and 0.39/0.36 for ASTRAEA. Reported syntactic and semantic diversity are 10.06 and 76.68.\n- **Concept applicability.** High for semantic concepts. The concept is a protected-attribute transformation plus the response relation that should remain invariant. This transfers directly to metamorphic tests for conventional programs.\n- **Evidence.** Full arXiv manuscript: <https://arxiv.org/pdf/2506.03024>\n\n## 12. Prompt engineering in LLMs for automated unit test generation: A large-scale study (2026)\n\n- **Method.** An empirical comparison of zero-shot, few-shot, chain-of-thought, tree-of-thought, and guided tree-of-thought prompts across GPT-3.5, GPT-4, Mistral 7B, and Mixtral 8x7B, with EvoSuite as a conventional baseline.\n- **Motivation.** Existing test-generation evaluations are often small or omit execution-driven quality, hallucinations, smells, and class-level context.\n- **Dataset + shape.** 216,300 generated tests over Defects4J, SF110, and CMD, a corpus intended to reduce LLM training-data leakage.\n- **Evaluation.** Guided Tree-of-Thought improves reliability, compilability, and structural adherence for general models. Compilation failures from hallucinated APIs/dependencies reach as high as 86% in the study; generated tests are generally more readable than EvoSuite but retain smells such as magic numbers and assertion roulette.\n- **Concept applicability.** High. Concept blocks can be injected as GToT branches: target path, required object state, and oracle premise. The scale and metrics make this an unusually good methodology reference for reporting failure modes.\n- **Evidence.** Full accepted manuscript: <https://orbilu.uni.lu/bitstream/10993/68099/1/s10664-026-10840-4.pdf>\n\n## 13. PALM: Synergizing Program Analysis and LLMs to Enhance Rust Unit Test Coverage (2025)\n\n- **Method.** PALM extracts branch conditions from Rust functions, combines them into path constraints with context, and prompts the LLM separately for each scenario.\n- **Motivation.** SBST/concolic methods struggle with complex branches and dependencies; fixed LLM prompts yield low compile rates and coverage.\n- **Dataset + shape.** Fifteen open-source Rust crates. The authors also submitted 91 generated tests targeting new code.\n- **Evaluation.** PALM-generated tests average 72.30% coverage, compared with 70.94% for human tests. Project coverage rises by over 50% in some cases within two to three hours. Of 91 submitted tests, 80 were accepted, 5 rejected, and 6 pending.\n- **Concept applicability.** Very high. PALM is closest to this repo's symbolic approach: retain its path constraint as the hard core, but add alias resolution, state transition, and minimal boundary strategy to reduce LLM search.\n- **Evidence.** Full arXiv manuscript: <https://arxiv.org/pdf/2506.09002>\n\n## 14. Static Analysis and LLM for Comprehensive Java Unit Test Generation (SAGEN, 2025)\n\n- **Method.** SAGEN uses AST static analysis to identify literal values and ranges before asking an LLM for Java tests.\n- **Motivation.** Manual generation is costly; generic generators miss useful value boundaries.\n- **Dataset + shape.** Abstract-only; not reported in accessible primary material.\n- **Evaluation.** The available abstract reports 10% higher code coverage and 13% higher test quality than EvoSuite/Randoop, with an 89.7% compile-pass rate. It does not provide the underlying corpus size in the accessible material.\n- **Concept applicability.** High but basic. Literal/range extraction is a useful component, yet it needs path polarity and data-flow context to avoid producing merely local boundary tests.\n- **Evidence.** Abstract-only, IEEE metadata: <https://doi.org/10.1109/AEMCSE65292.2025.11042526>\n\n## 15. Reinforcement Learning from Automatic Feedback for High-Quality Unit Test Generation (RLSQM, 2025)\n\n- **Method.** RLSQM trains a Codex-family generator with lightweight static-analysis reward models for five test-quality metrics, individually and combined, using PPO.\n- **Motivation.** Pretrained models reproduce low-quality tests and test smells. The paper finds undesirable smells in generated tests up to 37% of the time.\n- **Dataset + shape.** The accompanying data are released on Figshare. The reviewed abstract does not establish a safe exact train/test split count for this note.\n- **Evaluation.** RL improves quality metrics by up to 23%, yields nearly 100% syntactically correct tests, and outperforms GPT-4 on the reported static-quality metrics despite using a cheaper Codex model.\n- **Concept applicability.** Medium-high. Treat concept adherence as an extra reward, but do not reward only textual mention of a concept. Reward observable facts: target reached, mutant killed, or metamorphic relation preserved/violated.\n- **Evidence.** Full author PDF: <https://www.microsoft.com/en-us/research/wp-content/uploads/2024/12/2412.14308v1.pdf>\n\n## 16. Harnessing Large Language Models for Automated Software Testing: A Leap Towards Scalable Test Case Generation (2025)\n\n- **Method.** Fine-tunes Llama-2-7b-chat-hf with QLoRA for Java focal-method test generation.\n- **Motivation.** General prompting lacks project-specific test behavior; focal methods focus the model on the unit under test.\n- **Dataset + shape.** 25,000 curated records, tokenized for QLoRA training.\n- **Evaluation.** The article evaluates generated tests against baseline approaches, but the accessible abstract does not provide a single result table value suitable for quotation here.\n- **Concept applicability.** Medium. Fine-tuning could teach a compact concept vocabulary, but the current route is cheaper: externalize concepts in the prompt and evaluate causal compliance before committing to training.\n- **Evidence.** Full open-access article: <https://www.mdpi.com/2079-9292/14/7/1463>\n\n## 17. Mutation Testing via Iterative Large Language Model-Driven Scientific Debugging (2025)\n\n- **Method.** Given a Python mutant and its module, the LLM forms a behavioral hypothesis, writes an experiment/test, receives execution feedback, and repeats until it kills the mutant or explains it as equivalent. It is compared with direct prompting, blind retry, and Pynguin.\n- **Motivation.** A mutation-killing test must distinguish original and mutant semantics; plausible test imitation alone does not supply that reasoning.\n- **Dataset + shape.** Python programs and generated mutants; the full paper's experiment tables should be consulted for subject and mutant counts.\n- **Evaluation.** Iterative scientific debugging improves fault detection and coverage over Pynguin, at higher compute cost; iterative refinement is necessary for the strongest suites. Metrics include mutation score, coverage, kill success, and equivalent-mutant identification.\n- **Concept applicability.** Very high. A mutant is a ready-made concept: changed operator, original-vs-mutant divergence hypothesis, necessary input relation, and expected assertion. This is the strongest near-term semantic loop to add after TestEval.\n- **Evidence.** Full arXiv manuscript: <https://arxiv.org/pdf/2503.08182>\n\n## 18. A Systematic Approach for Assessing Large Language Models’ Test Case Generation Capability (GBCV, 2025)\n\n- **Method.** GBCV generates benchmark programs bottom-up from control-flow structures and variable-usage compositions, then asks models to produce input/output test cases.\n- **Motivation.** Existing benchmarks do not systematically span control-flow and data-use difficulty, making it hard to attribute model failures.\n- **Dataset + shape.** A configurable generated-program benchmark rather than a fixed mined corpus; it can target different languages and complexity levels.\n- **Evaluation.** GPT-4o performs better on complex structures than GPT-3-Turbo. Both identify boundary values in simple conditions but struggle with arithmetic computations. A valid test requires both input and expected output; correctness is checked by execution.\n- **Concept applicability.** High for controlled ablations. Generate paired tasks that differ in one concept, such as aliasing, arithmetic, or path conjunction, and measure whether the concept block fixes that exact failure.\n- **Evidence.** Full open-access article: <https://www.mdpi.com/2674-113X/4/1/5>\n\n## 19. LLM Driven Unit Test Case Generation Using Agentic AI (2025)\n\n- **Method.** An AutoGen-based agent workflow prompts for Python unit tests, executes and repairs failed tests, analyses results, and aims to improve coverage and mutation score.\n- **Motivation.** One-pass LLM tests often omit imports, invalid-input behavior, and boundary conditions.\n- **Dataset + shape.** The accessible full-text landing page does not establish a reproducible dataset size in the material reviewed.\n- **Evaluation.** The study reports coverage and mutation-testing evaluation, but this note leaves out exact values until the PDF tables are transcribed and checked.\n- **Concept applicability.** Medium-high. Concepts belong in the planner/critic state, not only the generator prompt: the critic should check whether a proposed test realizes the target relation.\n- **Evidence.** Full publisher PDF: <https://irojournals.com/jucct/article/pdf/7/4/3>\n\n## 20. CrossProbe: LLM-Empowered Cross-Project Bug Detection for Deep Learning Frameworks (2025)\n\n- **Method.** CrossProbe learns bug knowledge from issue/test material in one deep-learning framework and prompts an LLM to create tests for mirrored bugs in another framework.\n- **Motivation.** Deep-learning framework fuzzers face huge model/API/hardware spaces; prompting from only one framework loses transferable bug patterns.\n- **Dataset + shape.** Cross-project deep-learning framework issues and tests. The released repository contains the code and data, but the accessible project page should be paired with the paper PDF to quote corpus and framework counts.\n- **Evaluation.** The available primary metadata establishes cross-project bug detection but does not expose a checked numeric result table in the reviewed material.\n- **Concept applicability.** Very high. This treats the concept as a portable fault schema: API pattern, model/operator shape, triggering conditions, and expected crash or semantic discrepancy. That is an attractive extension beyond within-project AST concepts.\n- **Evidence.** Official project page and artifact: <https://hguandl.github.io/publications/crossprobe/> and <https://github.com/CrossProbe2024/CrossProbe>\n\n## Papers without accessible full text in this batch\n\n- #6 GEM: only official abstract/conference record found.\n- #8 Req2Test: official metadata available; no paper/manuscript retrieved.\n- #14 SAGEN: IEEE metadata/abstract available; no paper/manuscript retrieved.\n\nFor #2, #7, #11, #17, and #20, a preprint/artifact was available; use the linked primary source rather than secondary summaries when turning these notes into paper claims.\n"}, {"id": "batch-02", "label": "Batch 2", "range": "#21-40", "markdown": "# Full-text notes, catalog entries 21-40\n\n_Read on 2026-09-18. “Full text” means an official open PDF, author-accepted manuscript, or arXiv version was available and read. “Abstract-only” means the listed facts are restricted to the publisher or author abstract; missing fields are deliberately left missing._\n\n## 21. METAMON: Finding Inconsistencies between Program Documentation and Behavior using Metamorphic LLM Queries\n\n**Method.** METAMON uses EvoSuite regression tests to expose a Java method's observed behavior, then asks an LLM whether each generated oracle agrees with the method documentation. It adds metamorphic query transformations, chain-of-thought, and self-consistency to check the verdict.\n\n**Motivation.** Documentation can drift from code. Reading code and comments alone lets an LLM hallucinate a mismatch; concrete executions give it behavior to judge.\n\n**Dataset + shape.** 9,482 Java method/documentation pairs drawn from five Defects4J v2.0.1 projects.\n\n**Evaluation results.** It reports precision 0.72 and recall 0.48 for documentation-behavior inconsistency classification.\n\n**Concept applicability.** High. Treat a documented pre/postcondition as a concept, generate a source input, then generate a relation-preserving follow-up input. The oracle is whether code violates the relation promised by the documentation.\n\n**Evidence.** Full text. Primary source: https://arxiv.org/abs/2502.02794\n\n## 22. Evaluating the Effectiveness of Large Language Models in Automated Unit Test Generation\n\n**Method.** Compares GPT-4, Claude 3.5, Command-R-08-2024, and Llama 3.1 as JavaScript unit-test generators, then evaluates generated tests with Jest coverage and Stryker mutation testing.\n\n**Motivation.** Model choice for CI test generation should be measured with executable and mutation-based outcomes rather than prose quality.\n\n**Dataset + shape.** 106 test cases in 23 test suites, selected with input from software experts and QA engineers.\n\n**Evaluation results.** Claude 3.5 is reported at 93.33% test success, 98.01% statement coverage, and 89.23% mutation score.\n\n**Concept applicability.** Moderate. This is primarily a model comparison, but the Stryker survivors can be turned into concepts for a targeted second pass.\n\n**Evidence.** Abstract-only; publisher PDF was not openly retrievable. Primary source: https://doi.org/10.1109/icarc64760.2025.10962997\n\n## 23. HPCAgentTester: a Multi-Agent LLM Approach for Enhanced HPC Unit Test Generation\n\n**Method.** A Recipe Agent proposes an HPC-aware test recipe; a Test Agent writes tests; the pair iterates through critique for OpenMP and MPI code.\n\n**Motivation.** HPC tests must account for parallel execution, communication, synchronization, and nondeterminism, which a single generic code-generation prompt often omits.\n\n**Dataset + shape.** The accessible manuscript describes tests for OpenMP and MPI primitives. It does not state a reproducible corpus size in the accessible abstract.\n\n**Evaluation results.** The paper claims higher compilation and functional-correctness rates than a standalone LLM, but the accessible abstract does not provide the numeric table.\n\n**Concept applicability.** High for concurrent software. A concept record should carry communication topology, synchronization preconditions, data partitioning, and allowed nondeterminism. A separate recipe agent is a plausible place to synthesize that record.\n\n**Evidence.** Full text, but the available manuscript leaves corpus/result counts unclear. Primary source: https://arxiv.org/abs/2511.10860\n\n## 24. LLMs for Automated Unit Test Generation and Assessment in Java: The AgoneTest Framework\n\n**Method.** AgoneTest is an end-to-end Java test-generation and assessment framework. It generates class-level suites and measures coverage, mutation coverage, and test smells against human tests.\n\n**Motivation.** A test generator needs a common evaluation pipeline. Compilation alone does not tell whether a suite covers code, kills mutants, or accumulates poor test structure.\n\n**Dataset + shape.** It introduces Classes2Test, a class-to-corresponding-test-class dataset derived from Methods2Test. The accessible paper does not give a corpus count in its abstract.\n\n**Evaluation results.** The available abstract says that, among tests that compile, generated suites can match or exceed human suites on coverage and defect detection. It does not support a precise aggregate number.\n\n**Concept applicability.** Moderate. Use class dependencies, constructors, fixture setup, and existing-test gaps as a concept context. AgoneTest is more useful here as an evaluator than as a concept-generation method.\n\n**Evidence.** Full text for the framework paper; the catalog's 2025 title has a later arXiv version. Primary source: https://arxiv.org/abs/2408.07846\n\n## 25. Evaluating LLM-Generated Unit Tests with Mutation Testing: ChatGPT vs DeepSeek\n\n**Method.** Generates Java tests from structured prompts using GPT-4o and DeepSeek V3, repeats each model/class run five times, and evaluates PIT mutation coverage and mutation score plus compilation/runtime failures.\n\n**Motivation.** Coverage misses weak tests. The study asks whether generated tests kill seeded faults and whether complexity predicts generation failure.\n\n**Dataset + shape.** Six Java classes from Defects4J at different cyclomatic-complexity levels; two models; five runs per class/model. The released artifact includes prompts, generated suites, fixed mutant sets, PIT reports, and failure logs.\n\n**Evaluation results.** DeepSeek V3 is reported as more stable and more effective at killing mutants; GPT-4o generated valid suites for more classes. The paper reports no significant correlation between cyclomatic complexity and compilation success. The accessible abstract does not provide the aggregate mutation scores.\n\n**Concept applicability.** High. A live mutant's operator, changed expression, and required distinguishing behavior form a clean target concept. The artifact can support a direct mutation-guided ablation.\n\n**Evidence.** Abstract plus official artifact; paper PDF was not openly retrievable. Primary sources: https://doi.org/10.5753/sbqs.2025.13792 and https://zenodo.org/records/17250744\n\n## 26. STRUT: Structured Seed Case Guided Unit Test Generation for C Programs using LLMs\n\n**Method.** STRUT statically extracts focal-function context and builds a structured seed case. GPT-4o expands it into structured cases, and rule-based code translates those cases into executable C tests.\n\n**Motivation.** Directly asking an LLM for C test code fails on pointers, mocks, dependencies, and setup. A constrained intermediate representation narrows the generation task.\n\n**Dataset + shape.** The paper evaluates diverse C programs and compares against a direct GPT-4o baseline and SunwiseAUnit. The accessible page did not expose the exact project/function count.\n\n**Evaluation results.** STRUT achieves 96.01% execution pass rate, 77.67% line coverage, and 63.60% branch coverage. It reports 37% and 33% relative improvements in line and branch coverage over direct GPT-4o.\n\n**Concept applicability.** Very high. The structured seed is already a concept carrier: types, interface facts, branch-relevant assignments, mock effects, and output constraints. The current Python annotator could emit a comparable structured input record rather than prose tags.\n\n**Evidence.** Full text. Primary source: https://doi.org/10.1145/3728970\n\n## 27. A Large-Scale Empirical Study on Fine-Tuning Large Language Models for Unit Testing\n\n**Method.** Compares fine-tuning and prompting across three unit-testing tasks, five benchmarks, eight metrics, and 37 LLMs; it also analyzes architecture, size, leakage, and bug-detection implications.\n\n**Motivation.** Earlier LLM unit-test studies were too narrow to distinguish model scale, architecture, fine-tuning, and prompting effects.\n\n**Dataset + shape.** Three tasks, five benchmarks, 37 models, and more than 3,000 NVIDIA A100 GPU-hours. The test-generation result quoted in the paper uses Defects4J; the source code and data are released.\n\n**Evaluation results.** On test generation, GPT-3.5 reaches 49.16% correct rate and 51.03% passing rate; the strongest fine-tuned model named in the paper, DeepSeek-Coder-6B, reaches 45.96% and 41.67%. Across tasks, the study reports LLMs outperforming prior methods on nearly all metrics, while warning about leakage and weak bug-detection evidence.\n\n**Concept applicability.** Moderate. This paper does not propose concepts, but it supplies a useful warning: compare concept prompting against an equal model and prompt budget, and hold the benchmark split fixed.\n\n**Evidence.** Full text. Primary source: https://arxiv.org/abs/2412.16620\n\n## 28. PRIMG: Efficient LLM-driven Test Generation Using Mutant Prioritization\n\n**Method.** PRIMG first runs mutation testing on Solidity smart contracts. A learned model over mutant subsumption graphs prioritizes surviving mutants; an LLM then generates and refines a test for the chosen mutant until syntax and behavior checks pass.\n\n**Motivation.** Mutation-guided LLM generation becomes costly when real projects create many surviving mutants and a test per mutant bloats the suite.\n\n**Dataset + shape.** Real-world Solidity projects from Code4Arena. The accessible manuscript does not provide the number of projects/contracts in the text retrieved here.\n\n**Evaluation results.** PRIMG reports higher mutation coverage with a smaller suite and lower effort than random mutant selection. The accessible abstract does not expose exact aggregate numbers.\n\n**Concept applicability.** Very high. Mutant selection is exactly concept selection: mutation operator, affected state transition, and expected behavioral distinction. Its subsumption graph suggests a principled way to prioritize concept targets.\n\n**Evidence.** Full text. Primary source: https://arxiv.org/abs/2505.05584\n\n## 29. Towards metamorphic testing with LLM-based workflows: Metamorphic relation inference and follow-up test case generation\n\n**Method.** The catalog identifies this as an LLM workflow for inferring metamorphic relations and generating follow-up tests. A primary open manuscript was not found during this batch.\n\n**Motivation.** Metamorphic testing supplies an oracle when exact expected outputs are unavailable.\n\n**Dataset + shape.** Not recoverable from an official full text in this batch.\n\n**Evaluation results.** Not recoverable from an official full text in this batch.\n\n**Concept applicability.** High in principle: each inferred relation becomes a concept comprising input transformation, required output relation, and validity preconditions. Exact feasibility remains unassessed until the paper is obtained.\n\n**Evidence.** Abstract-only metadata. Primary source: https://doi.org/10.1016/j.infsof.2026.108150\n\n## 30. An LLM-Driven Fuzzing Framework for Detecting Logic Instruction Bugs in PLCs\n\n**Method.** LogicFuzz builds a semantic dependency graph for PLC instructions, uses enable signals to synthesize valid seed programs, mutates invocation contexts for control-triggered faults, and applies constrained parameter mutation for data-triggered faults. Its oracle combines logs, LEDs, and communication state.\n\n**Motivation.** Proprietary PLC firmware prevents reliable static recovery of code boundaries, layouts, and calling conventions, but instruction faults still need valid, stateful trigger programs.\n\n**Dataset + shape.** Six production PLCs from three vendors; 338 logic instructions evaluated; the paper also reports 1,743 bug clues attached to its semantic dependency graphs.\n\n**Evaluation results.** It finds 19 instruction-level bugs, including four previously unknown vulnerabilities.\n\n**Concept applicability.** Very high. The semantic dependency graph is an explicit concept representation. For test generation, retain instruction semantics, enable condition, predecessor instructions, parameter constraints, and physical/runtime oracle as separate fields.\n\n**Evidence.** Full text. Primary source: https://www.ndss-symposium.org/wp-content/uploads/2026-f1081-paper.pdf\n\n## 31. Search+LLM-Based Testing for ARM Simulators\n\n**Method.** SearchSYS asks an LLM for initial C programs, compiles them, fuzzes the binaries, then differentially executes them on real ARM hardware and the gem5 simulator.\n\n**Motivation.** A simulator can execute a vast program space yet subtly disagree with hardware; hand-written tests cannot cover the ISA/program combinations.\n\n**Dataset + shape.** One target simulator, gem5, checked against actual ARM hardware. The released artifact contains the experiment material; the paper does not frame this as a conventional fixed benchmark count.\n\n**Evaluation results.** It identifies 624 bug-activating cases from LLM-generated tests and 126 from fuzzed inputs; developers acknowledged four unique bugs.\n\n**Concept applicability.** High. An ISA instruction family, operand types/ranges, memory mode, and expected hardware/simulator equivalence give a precise differential-testing concept.\n\n**Evidence.** Full author-accepted manuscript. Primary source: https://discovery.ucl.ac.uk/10203327/1/main.pdf\n\n## 32. Clozemaster: Fuzzing Rust Compiler by Harnessing LLMs for Infilling Masked Real Programs\n\n**Method.** ClozeMaster mines historical Rust compiler bug-triggering programs, masks structurally meaningful regions with `clozeMask`, and asks an LLM to infill them. The retained context preserves enough syntax and semantic structure for valid compiler tests.\n\n**Motivation.** Generating Rust compiler inputs from scratch produces too many invalid programs; mutation can also destroy the delicate structure that reaches deep compiler behavior.\n\n**Dataset + shape.** Historical Rust issue-report test code is the seed corpus; tests run against rustc and mrustc. The accessible abstract does not give the seed-corpus count.\n\n**Evaluation results.** The currently accessible preprint reports 27 confirmed bugs, 10 fixed by developers, and better coverage/effectiveness than compared fuzzers.\n\n**Concept applicability.** Very high. The masked AST/grammar role, surrounding type context, and bug-history feature form a structured concept for an infilling model. This is stronger than prompt-only “write a weird Rust program.”\n\n**Evidence.** Full text for the accessible preprint. Catalog year/DOI and the current arXiv version conflict: the catalog lists ICSE 2025, while the accessible arXiv record is dated 2026. Verify the bibliographic version before citation. Primary source: https://arxiv.org/abs/2605.00413\n\n## 33. When Software Security Meets Large Language Models: A Survey\n\n**Method.** Survey of LLM use in software security, including vulnerability discovery, fuzzing, code analysis, and repair.\n\n**Motivation.** Security tasks expose both the potential and reliability limits of LLM-based program reasoning.\n\n**Dataset + shape.** A survey, not a primary test-generation benchmark.\n\n**Evaluation results.** No single experimental result should be used as evidence for the concept method.\n\n**Concept applicability.** Indirect. Use it to map security concepts such as CWE, source/sink, sanitizer, guard, and exploit precondition; do not use it as an experimental baseline.\n\n**Evidence.** Abstract-only for this batch. Primary source: https://doi.org/10.1109/jas.2024.124971\n\n## 34. Kaizen: Metamorphic Fuzzing and Differential Testing for LLM-Translated HPC Applications\n\n**Method.** Kaizen mutates source code into semantically equivalent variants, fuzzes inputs with a grammar, and differentially compares CUDA originals with LLM-generated OpenMP translations.\n\n**Motivation.** Compilation, token similarity, and static benchmark tests can all accept an HPC translation that computes scientifically wrong results on particular inputs.\n\n**Dataset + shape.** 16 CUDA scientific applications from seven domains, translated to OpenMP by three fine-tuned models at kernel and full-program granularities.\n\n**Evaluation results.** The study finds nine recurring compile-error categories for kernel translation and 27 for full-program translation. It shows that semantic errors remain after compilation and developer tests, but the accessible abstract does not state a total confirmed-bug count.\n\n**Concept applicability.** High. The concept is a semantic-preserving source transformation, input-domain relation, and cross-version equality/tolerance oracle. This shape translates cleanly to Python numerical code or API differential tests.\n\n**Evidence.** Full text. Primary source: https://arxiv.org/abs/2607.04058\n\n## 35. Hallucination to Consensus: Multi-Agent LLMs for End-to-End JUnit Test Generation\n\n**Method.** CANDOR uses specialized agents to construct test prefixes and generate assertions, then applies a consensus mechanism among reasoning agents to decide oracles.\n\n**Motivation.** High coverage with regression assertions can encode current bugs. Java needs correct setup, compileable tests, and intended-behavior oracles.\n\n**Dataset + shape.** The accessible paper compares end-to-end Java unit-test generation against EvoSuite and oracle generation against TOGLL. Exact project/dataset counts were not retrieved in this batch.\n\n**Evaluation results.** CANDOR reports coverage comparable to EvoSuite and at least 21.1 percentage points higher oracle correctness than TOGLL on both correct and faulty source code.\n\n**Concept applicability.** High. Give the planner a concept record, but require independent agents to challenge the implied postcondition. Consensus is useful when a static concept is uncertain or underspecified.\n\n**Evidence.** Full text. Primary source: https://arxiv.org/abs/2506.02943\n\n## 36. Understanding the Characteristics of LLM-Generated Property-Based Tests in Exploring Edge Cases\n\n**Method.** Uses Claude-4-Sonnet to generate property-based tests (PBT) and example-based tests (EBT), then compares the edge-case faults each catches.\n\n**Motivation.** Example tests tend to miss large input spaces; properties explore broadly but can miss particular boundary patterns.\n\n**Dataset + shape.** 16 HumanEval problems whose standard solutions fail extended tests. The model generates roughly three to five PBTs or 10 to 20 EBT cases per problem.\n\n**Evaluation results.** PBT and EBT each detect bugs in 68.75% of the 16 problems; combining them reaches 81.25%. PBT catches performance and broad input-space issues, while EBT catches specific boundaries and special patterns.\n\n**Concept applicability.** Very high. A concept can generate both a property and a minimal boundary witness. Run both because they expose different failures.\n\n**Evidence.** Full text. Primary source: https://arxiv.org/abs/2510.25297\n\n## 37. Mutant-Driven Test Generation for Ethereum Smart Contracts via LLMs\n\n**Method.** Alchemist generates tests from live Solidity mutants and follows a scientific-method loop: form a hypothesis about the mutant, generate a test, execute it, and refine the hypothesis/test.\n\n**Motivation.** Mutation testing identifies weak contract tests but developers need help converting live mutants into behaviorally meaningful test cases.\n\n**Dataset + shape.** Solidity projects; exact corpus size was not available in an official accessible PDF during this batch.\n\n**Evaluation results.** The available official abstract says Alchemist improves test quality over direct prompting and reduces developer effort; it does not provide numeric results.\n\n**Concept applicability.** Very high. The mutation is the concept and the hypothesis loop is a natural implementation of concept-guided feedback. It is closely aligned with the current symbolic-plus-feedback design.\n\n**Evidence.** Abstract-only. Primary source: https://doi.org/10.1109/aitest66680.2025.00033\n\n## 38. Enhancing Search-Based Testing with LLMs for Finding Bugs in System Simulators\n\n**Method.** SearchSYS generates parameterized input programs with six LLMs, mutates the compiled programs and parameters using AFL++, and uses hardware-vs-simulator differential execution as the oracle.\n\n**Motivation.** Architecture simulators receive less fuzzing attention than ordinary software despite incorrect simulation affecting hardware design decisions.\n\n**Dataset + shape.** gem5 is the program under test; the experiment spans six LLMs and compares its behavior with real hardware.\n\n**Evaluation results.** SearchSYS finds 21 new gem5 bugs: 14 hardware/simulator prediction mismatches and seven crashes. Every one of the six LLMs contributed new defects.\n\n**Concept applicability.** High. Seed-generation concepts should name instruction syntax, operand and parameter types, and the intended differential relation. Fuzzing then mutates within that concept's grammar.\n\n**Evidence.** Full text. Primary source: https://discovery.ucl.ac.uk/id/eprint/10209206/\n\n## 39. Metamorphic Testing for Fairness Evaluation in Large Language Models: Identifying Intersectional Bias in LLaMA and GPT\n\n**Method.** Defines fairness-focused metamorphic relations over sensitive attributes, generates source/follow-up prompts, and flags output changes in tone or sentiment that violate the relation.\n\n**Motivation.** A fixed expected answer is rarely available for fairness. Varying a protected attribute while preserving task meaning gives an executable fairness oracle.\n\n**Dataset + shape.** Tests GPT-4.0 and LLaMA 3.0 across demographic combinations including race, gender, age, marital status, and socioeconomic background. The accessible thesis reports a broad set of add/remove/substitute/paraphrase/permutation relations but not a single fixed corpus count.\n\n**Evaluation results.** Tone-based relations detected up to 2,200 fairness violations; sentiment-based relations detected fewer than 500.\n\n**Concept applicability.** High for metamorphic tests. Record the semantic invariant, allowed input transformation, sensitive dimensions, and comparison function. This is directly reusable for non-fairness APIs as well.\n\n**Evidence.** Full author manuscript/thesis. Primary source: https://arxiv.org/abs/2504.07982\n\n## 40. TOGLL: Correct and Strong Test Oracle Generation with LLMs\n\n**Method.** Fine-tunes seven code LLMs with six prompt forms on oracle-generation data, selects the best model/prompt combination, and generates assertions and exception oracles for existing tests.\n\n**Motivation.** A test input without a correct oracle cannot reliably detect a bug. Earlier neural oracle generators produced many false positives and weak assertions.\n\n**Dataset + shape.** Training uses SF110. Generalization evaluation uses 25 large Java projects; the study also evaluates correctness, oracle diversity, mutation strength, and unique bug detection.\n\n**Evaluation results.** TOGLL produces 3.8 times more correct assertion oracles and 4.9 times more correct exception oracles than the reported baselines. It finds 1,023 unique bugs not found by EvoSuite, about ten times the unique-bug count of TOGA.\n\n**Concept applicability.** Very high. Feed a concept as an intended postcondition or invariant, then use an oracle generator/critic to decide the assertion. This directly addresses the main weakness of the current TestEval pipeline: a test that covers a target may still assert the wrong thing.\n\n**Evidence.** Full text. Primary source: https://arxiv.org/abs/2405.03786\n\n**Artifacts (checked 2026-09-29).** Code: verified source [doi.org/10.6084/m9.figshare.28282721.v3](https://doi.org/10.6084/m9.figshare.28282721.v3) (Figshare artifact, 7.2 GB zip: RQ1 fine-tune/inference .py (fine_tune_code_parrot.py etc.), RQ2-5 data+tests; no GitHub repo). Dataset: SF110-derived oracle dataset (fine-tune), OracleEval25 (25 Java projects), Defects4J — released by authors [doi.org/10.6084/m9.figshare.28282721.v3](https://doi.org/10.6084/m9.figshare.28282721.v3). Models: CodeGPT-small-java (110M), CodeParrot-small-multi (110M, selected), CodeGen-350M-multi, CodeGen-2B-multi, PolyCoder-0.4B, PolyCoder-2.7B, Phi-1 (1.3B).\n\n## Inaccessible or incomplete full-text items\n\n- #22 Evaluating the Effectiveness of Large Language Models in Automated Unit Test Generation: publisher PDF not open.\n- #25 Evaluating LLM-Generated Unit Tests with Mutation Testing: ChatGPT vs DeepSeek: official artifact open, paper PDF not located.\n- #29 Towards metamorphic testing with LLM-based workflows: Metamorphic relation inference and follow-up test case generation: official full text not located.\n- #33 When Software Security Meets Large Language Models: A Survey: full text not retrieved in this batch.\n- #37 Mutant-Driven Test Generation for Ethereum Smart Contracts via LLMs: full text not retrieved in this batch.\n\n_Partial-detail caveat: #23, #24, #26, #28, and #35 had accessible manuscript text but the retrieved text did not expose every dataset count or aggregate result. Those fields stay qualified rather than inferred._\n"}, {"id": "batch-03", "label": "Batch 3", "range": "#41-60", "markdown": "# Full-Text Reading Batch 03: Catalog #41-60\n\n_Read on 2026-09-18. “Full text read” means an official PDF, an author-hosted manuscript, or an official open-access article was available. “Abstract-only” means the publisher record was found but no lawful full text was available during this pass. Numbers are omitted rather than inferred in those cases._\n\n## 41. Mutation-Guided LLM-based Test Generation at Meta\n\n**Method.** ACH creates privacy-relevant mutants, filters likely-equivalent ones, then asks an LLM to write a test that kills each survivor. Engineers review the resulting tests as ordinary diffs.\n\n**Motivation.** Coverage can rise without detecting a changed behavior. A non-equivalent mutant gives the generator a concrete behavior to distinguish.\n\n**Dataset + shape.** Deployment over 10,795 classes in seven Meta product/code areas. It created 31,677 mutants; 9,095 built and passed; 4,660 non-equivalent mutants became generation targets.\n\n**Evaluation.** Engineers accepted 27/30 initial tests and 73% of test-a-thon submissions. ACH killed mutants in 15% of targeted classes versus 2.4% for the coverage-only baseline; 49% of its uniquely mutant-killing tests added no line coverage.\n\n**Concept applicability.** Direct fit. Store mutant operator, changed expression, required distinguishing input, and buggy-versus-mutant oracle as the concept record. This supplies a semantic target missing from line coverage.\n\n**Evidence.** Full text read. [Primary source](https://arxiv.org/abs/2501.12862).\n\n**Artifacts (checked 2026-09-29).** Code: closed / not released (ACH is internal Meta tooling; paper gives prompts (Table 1) but no code release). Dataset: Meta internal: 10,795 Android Kotlin classes in 7 Meta platforms; 9,095 mutants, 571 tests — not released. Models: Llama 3.1 70B.\n\n## 42. MORTAR: Multi-turn Metamorphic Testing for LLM-based Dialogue Systems\n\n**Method.** MORTAR builds multi-turn dialogue tests from metamorphic relations. It transforms an earlier turn or dialogue context, then treats a violated relation between the two responses as the oracle.\n\n**Motivation.** Single-turn tests miss failures caused by dialogue history, while exact expected answers are difficult to specify for open-ended LLM systems.\n\n**Dataset + shape.** The paper evaluates dialogue-system testing scenarios with multi-turn prompts and metamorphic follow-up cases. The accessible manuscript describes the evaluation design but this pass did not extract a stable dataset-count table.\n\n**Evaluation.** It reports that multi-turn metamorphic testing exposes unexpected dialogue behavior that single-turn testing misses. No headline aggregate is repeated here because the available source version was revised after publication and its result tables differ across versions.\n\n**Concept applicability.** High for stateful systems. A concept becomes: source dialogue state, allowed transformation, expected relation, and the turn at which the relation must hold. This is useful for API workflows and agents, less directly for isolated TestEval functions.\n\n**Evidence.** Full text read. [Primary source](https://arxiv.org/abs/2412.15557).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/Guoxiang365/MORTAR](https://github.com/Guoxiang365/MORTAR) (Python (perturbation, equivalent-context check, runners) + RQ notebooks, 2.7 MB, push 2026-04; mirror zenodo.org/records/19556799). Dataset: CoQA (dev set) as seed dialogues — public benchmark only [stanfordnlp.github.io/coqa](https://stanfordnlp.github.io/coqa/). Models: Qwen2-0.5B-Instruct, Qwen2-1.5B-Instruct, Qwen2-7B-Instruct, Mistral-7B-Instruct-v0.3, Llama-3-8B-Instruct, Gemma-2-9b-it, GPT-5-nano, GPT-5, gpt-oss-120B (pipeline, via Groq), gte-large-en-v1.5 (embeddings).\n\n## 43. RUG: Turbo LLM for Rust Unit Test Generation\n\n**Method.** RUG decomposes Rust test-context construction bottom-up: resolve dependent types and setup pieces with LLM calls, verify each piece, merge them into a test context, then use coverage-guided fuzzing to build harnesses and add tests.\n\n**Motivation.** Rust ownership, borrowing, and type dependencies make naive generated tests fail to compile; existing generators also leave coverage low.\n\n**Dataset + shape.** 17 real Rust projects, averaging 24,937 lines of code. The authors also submitted 113 generated tests upstream.\n\n**Evaluation.** RUG reaches up to 71.37% coverage, near the reported 73.18% human-test coverage. Of the 113 submitted tests, 53 were accepted, 17 rejected, and 43 pending at reporting time.\n\n**Concept applicability.** High. Concepts should include constructor/type obligations, ownership and lifetime constraints, dependency setup, and an uncovered target path. This supports the current idea of target-specific constraints but requires a language-aware context builder.\n\n**Evidence.** Full text read. [Author PDF](https://mainarke.github.io/assets/papers/icse25_cheng.pdf); [artifact](https://github.com/CXWorks/rug).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/CXWorks/rug](https://github.com/CXWorks/rug) (rug: example scripts + generated-test artifact (45 MB, push 2025-06); rustc-plugin source in CXWorks/rug-ae rug_ae1/source/safefinder). Dataset: 17 Rust crates from RULF/RPG, RustyUnit, SyRust benchmarks + 10 post-2022 crates (RQ5) — released by authors [github.com/CXWorks/rug/tree/main/ae](https://github.com/CXWorks/rug/tree/main/ae). Models: gpt-3.5-turbo-16k-0613, gpt-4-1106 (GPT-4 Turbo), gpt-3.5-turbo-0125 (RQ5).\n\n## 44. Understanding LLM-Driven Test Oracle Generation\n\n**Method.** An empirical study varies prompt strategy and supplied context for LLM-generated test oracles, then measures whether the generated assertions expose failures rather than merely encode current behavior.\n\n**Motivation.** Regression oracles from tools such as Randoop and EvoSuite assume the implementation is correct. The study asks whether LLMs can write assertions about intended behavior instead.\n\n**Dataset + shape.** The paper evaluates generated oracles across multiple prompt/context configurations. The author manuscript available in this pass does not make a compact public dataset summary easy to verify, so no count is asserted here.\n\n**Evaluation.** The study compares oracle quality under different context levels and prompting strategies. It is an empirical characterization paper; do not cite a fault-detection percentage from this note without consulting its tables.\n\n**Concept applicability.** Very high. A concept can act as assertion evidence: invariant/postcondition, authority for it, relevant state transition, and counterexample condition. It is a better place to put concepts than a generic list of AST tags.\n\n**Evidence.** Full text read. [Author manuscript](https://valerio-terragni.github.io/assets/pdf/bodicoat-aiware-2025.pdf).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [doi.org/10.6084/m9.figshare.30472256](https://doi.org/10.6084/m9.figshare.30472256) (Figshare: tool.py, gpt_tool.py, starcoder_tool.py, prompts.md (~30 KB); tests.json is only a format template). Dataset: GHRB (GitHub Recent Bugs, Java) — public benchmark only. Models: StarCoder v1.0, gpt-4o-mini-2024-07-18.\n\n## 45. Knowledge Matters: Injecting Project and Testing Knowledge into LLM-based Unit Test Generation\n\n**Method.** KTester extracts project structure and usage knowledge through static analysis, separates test-case design from test-method generation, and injects testing-domain knowledge into both stages.\n\n**Motivation.** Repository tests need valid setup, dependencies, mocks, and project conventions. Source-only prompting often writes tests that compile poorly or do not fit the repository.\n\n**Dataset + shape.** The manuscript evaluates repository-level Java unit-test generation. It includes project code plus extracted structure/usage knowledge rather than isolated functions; consult the paper tables for the project list and counts.\n\n**Evaluation.** KTester is evaluated against prior LLM-based approaches on correctness, coverage, and maintainability-oriented measures. This note avoids quoting a number because the accessible version is an ICSE 2026 manuscript whose final table values may change.\n\n**Concept applicability.** Direct fit. Extend the current concept schema with dependency graph facts, valid object-construction paths, collaborator usage, mock boundaries, and existing test conventions. This paper is the cleanest precedent for calling that material “knowledge,” not merely prompt decoration.\n\n**Evidence.** Full text read. [Author PDF](https://mingwei-liu.github.io/assets/pdf/ICSE26KTester.pdf); [official artifact](https://github.com/SYSUSELab/KTester).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/SYSUSELab/KTester](https://github.com/SYSUSELab/KTester) (Python pipeline (tools/, templates/) + Java static-analysis modules, 226 MB, push 2026-04; arXiv 2511.14224). Dataset: HITS dataset: 110 focal methods from 10 open-source Java projects — released by authors [github.com/SYSUSELab/KTester/tree/main/data](https://github.com/SYSUSELab/KTester/tree/main/data). Models: GPT-4o-mini (KTester + LLM baselines), CodeLlama-7B (UTGen baseline).\n\n## 46. Acceptance Test Generation with Large Language Models: An Industrial Case Study\n\n**Method.** A two-stage workflow first generates Gherkin acceptance scenarios from user stories, then converts scenarios into Cypress scripts using page HTML. The work integrates AutoUAT and Test Flow into an industrial workflow.\n\n**Motivation.** Unit-test generation is common, while executable acceptance tests remain expensive and underexplored. Separating scenario design from script creation gives testers a review point before automation.\n\n**Dataset + shape.** Real web-application projects from an industry partner, using user stories, pages, generated Gherkin scenarios, and Cypress tests.\n\n**Evaluation.** Users rated 95% of generated scenarios helpful. For generated Cypress tests, 92% were helpful: 60% usable unchanged, 8% needing minor fixes, 24% needing regeneration with more input, and 8% discarded.\n\n**Concept applicability.** Medium-high. A concept can carry acceptance criterion, user role, state precondition, UI elements, and expected observable outcome. It transfers well to workflow testing but not directly to algorithmic fault exposure.\n\n**Evidence.** Full text read. [Primary source](https://arxiv.org/abs/2504.07244).\n\n**Artifacts (checked 2026-09-29).** Code: closed / not released (AutoUAT and Test Flow built inside industrial partner's (automotive) Azure env; no release). Dataset: Partner-company web projects: user stories, pages, Gherkin/Cypress (confidential) — not released. Models: GPT-4 Turbo (gpt-4-1106-preview, Azure OpenAI).\n\n## 47. ASTER: Natural and Multi-Language Unit Test Generation with LLMs\n\n**Method.** ASTER uses lightweight static analysis to build prompts, validates and refines generated tests, and issues additional prompts for uncovered code paths. It supports Java and Python and handles external dependencies through mocking.\n\n**Motivation.** Few generators work across languages or produce tests developers find readable; naive prompts also struggle with environment setup.\n\n**Dataset + shape.** Standard and enterprise Java applications, plus a large Python benchmark. The study includes a user study with 161 professional developers to judge naturalness.\n\n**Evaluation.** The paper reports coverage competitive with or above the compared generators and substantially more natural tests. The available primary summary does not expose a single aggregate coverage number, so this note keeps the result qualitative.\n\n**Concept applicability.** High. ASTER validates the static-analysis-to-prompt route already used here. Improve it by giving analysis output an explicit semantic form: guard, feasible setup, dependency/mocking plan, target behavior, and oracle.\n\n**Evidence.** Full text read. [Primary source](https://arxiv.org/abs/2409.03093); [IBM technical note](https://research.ibm.com/blog/aster-llm-unit-testing).\n\n**Artifacts (checked 2026-09-29).** Code: data/prompts only, no tool source [github.com/aster-test-generation/aster](https://github.com/aster-test-generation/aster) (Repo = generated tests, modified CodaMOSA baseline, naturalness scripts, figures (166 MB); ASTER generator not released (IBM watsonx product)). Dataset: Commons CLI/Codec/Compress/JXPath, CargoTracker, PetClinic, DayTrader, proprietary App X; CodaMOSA Python benchmark — partially released [github.com/aster-test-generation/aster](https://github.com/aster-test-generation/aster). Models: GPT-4-turbo, Llama3-70B, CodeLlama-34B, Granite-34B, Llama3-8B, Granite-8B, GPT-3.5-turbo-instruct (CodaMOSA baseline).\n\n## 48. Test Intention Guided LLM-Based Unit Test Generation\n\n**Method.** IntUT supplies an explicit test intention: test inputs, mock behavior, and expected result. The LLM writes the concrete Java test from that intention.\n\n**Motivation.** Direct LLM test generation tends to produce low coverage and weak mocking because it has to infer all three design decisions from source alone.\n\n**Dataset + shape.** Three industrial Java projects, followed by a live study on three new Java projects.\n\n**Evaluation.** The accessible abstract reports up to 94% branch-coverage and 49% line-coverage improvement, over 80% line coverage in the live study, and 30% less unit-test writing effort. The full ICSE paper was not publicly accessible in this pass.\n\n**Concept applicability.** Direct fit. The current symbolic concept must become a full test intention: feasible input relation, mock/stub requirements, expected result, and target path. This is a close precedent for the proposed method.\n\n**Evidence.** Abstract-only. [Publisher record](https://doi.org/10.1109/ICSE55347.2025.00243).\n\n**Artifacts (checked 2026-09-29).** Code: none found (No public repo found; IntentionTest (arXiv 2507.20619) states IntUT code and data are not public). Dataset: 3 industrial Java projects + live study on 3 new Java projects — not released. Models: unknown.\n\n## 49. LWDIFF: an LLM-Assisted Differential Testing Framework for WebAssembly Runtimes\n\n**Method.** LWDIFF uses an LLM to generate and mutate WebAssembly programs, then runs them on multiple runtimes. It uses differential outcomes as the oracle and a multi-armed-bandit selector to choose productive mutation operators.\n\n**Motivation.** Existing Wasm testing does not cover decoding, validation, and execution well enough, while writing diverse valid Wasm programs by hand is hard.\n\n**Dataset + shape.** Eight WebAssembly runtimes; generated tests span binary/text programs and three runtime phases.\n\n**Evaluation.** LWDIFF found 31 bugs, 25 previously unknown; all were confirmed and fixed by runtime developers. It outperformed the compared Wasm testing tools in the reported experiments.\n\n**Concept applicability.** High. Use a concept as a divergence hypothesis: runtime feature, phase, valid/invalid encoding constraint, expected cross-runtime agreement, and mutation family. Differential testing removes the need for a manually written assertion.\n\n**Evidence.** Full text read. [Accepted manuscript](https://discovery.ucl.ac.uk/id/eprint/10222953); [author PDF](https://www4.comp.polyu.edu.hk/~csxluo/LWDIFF.pdf).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/erxiaozhou/LWDIFF2024](https://github.com/erxiaozhou/LWDIFF2024) (Python tester (363 .py), LLM spec-extraction code, Docker env, bug PoCs; 88 MB, push 2025-10). Dataset: 8 Wasm runtime configs (Wasmer, WasmEdge, Wasmtime, WAMR x5 modes) + Wasm spec; PoCs in repo — released by authors [github.com/erxiaozhou/LWDIFF2024](https://github.com/erxiaozhou/LWDIFF2024). Models: GPT-4.\n\n## 50. DrWASI: LLM-assisted Differential Testing for WebAssembly System Interface Implementations\n\n**Method.** The catalog identifies DrWASI as LLM-assisted differential testing of WASI implementations. It generates tests and uses behavioral disagreement between implementations as the oracle.\n\n**Motivation.** WASI has multiple implementations and platform-dependent behavior, making a single hand-written expected output insufficient for broad compatibility testing.\n\n**Dataset + shape.** Not verified from full text in this pass.\n\n**Evaluation.** Not asserted. The publisher landing page was available, but no author manuscript or open full text was found during this pass.\n\n**Concept applicability.** Plausibly high: API contract, filesystem/process state, environment setup, and expected cross-implementation relation form a useful concept. Treat this as a hypothesis until the paper is read.\n\n**Evidence. B, Llama-3.1-8B, Gemma-7B, StarCoder2-15B-Instruct, DeepSeek-Coder-1.3B/6.7B/33B, CodeQwen-7B.\n\n## 56. Large Language Models for C Test Case Generation: A Comparative Analysis\n\n**Method.** Compares several LLMs and prompt contexts for program-level C tests, measuring Pass@1 and line coverage. Prompts vary whether they include a statement, C solution, Python solution, and example tests.\n\n**Motivation.** Most LLM test-generation studies focus on Python or Java; this study asks how context changes C test quality on non-public tasks.\n\n**Dataset + shape.** Original, non-public C programming problems created to reduce training contamination. The benchmark uses HumanEval-ranked models and corresponding problem descriptions/solutions.\n\n**Evaluation.** `GPT-4o Preview` reaches 98.7% line coverage when given both statement and C implementation. Llama 3.3 and Qwen 2.5 remain around 96.1-98.4% and 97-98% coverage respectively across several C-context prompts. Example tests help some models more than others.\n\n**Concept applicability.** Medium. It supports supplying structured context, but it evaluates solution verification on small programs rather than fault exposure. A concept ablation here should separate raw source context from explicit guard/boundary/oracle facts.\n\n**Evidence.** Full text read. [Open-access article](https://www.mdpi.com/2079-9292/14/11/2284).\n\n**Artifacts (checked 2026-09-29).** Code: none found (No code link in paper; GitHub search found nothing). Dataset: 40 introductory C problems, mostly authored by the paper's team (non-public by design) — not released. Models: GPT-4o Preview (Sep 2024), Claude-3.5-Sonnet (Oct 2024), Qwen2.5-Coder-32B-Instruct, Amazon Nova Pro, Llama-3.3-70B.\n\n## 57. Unify and Triumph: Polyglot, Diverse, and Self-Consistent Generation of Unit Tests with LLMs\n\n**Method.** PolyTest generates tests in multiple programming languages at zero temperature and unifies them; it also samples diverse tests within a language at higher temperature before unification.\n\n**Motivation.** A single test-generation trace has limited diversity. Different language realizations and samples expose complementary test ideas.\n\n**Dataset + shape.** The paper evaluates polyglot unit-test generation across multiple language settings. Exact project/task counts were not extracted in this pass.\n\n**Evaluation.** It reports that cross-language and within-language diversity produce complementary tests. No aggregate percentage is quoted here without the paper tables.\n\n**Concept applicability.** Medium-high. Keep the same semantic concept fixed while sampling several test implementations or language front-ends, then merge candidates by coverage, mutation kill, or fault exposure. The main value is diversity after analysis, not analysis itself.\n\n**Evidence.** Full text read. [Primary source](https://arxiv.org/abs/2503.16144).\n\n**Artifacts (checked 2026-09-29).** Code: link dead [anonymous.4open.science/r/Polytest-C96C](https://anonymous.4open.science/r/Polytest-C96C/) (Only link is an anonymous repo; API returns repository_expired; no GitHub copy found). Dataset: EvalPlus (HumanEval+, 164 problems); Pynguin baseline — public benchmark only. Models: Llama-3-70B, GPT-4o, GPT-3.5-turbo.\n\n## 58. Towards Large Language Model Guided Kernel Direct Fuzzing\n\n**Method.** SyzAgent combines Syzkaller with static call-graph analysis and real-time LLM guidance. Given a target kernel function, it finds relevant paths from syscalls and feeds code plus fuzzing state back to the LLM for seed generation and mutation guidance.\n\n**Motivation.** Direct kernel fuzzing needs to reach a specific region despite rapidly changing code and deep syscall/resource dependencies.\n\n**Dataset + shape.** A benchmark of targeted kernel-fuzzing cases. The paper describes LLVM IR preprocessing, kernel call graphs, syscall-to-target paths, and dynamic fuzzing feedback; it does not present a large public defect corpus.\n\n**Evaluation.** Preliminary experiments find the approach effective in about 67% of benchmark cases. The authors present it as an exploratory framework rather than a finished large-scale evaluation.\n\n**Concept applicability.** Very high. Target function, syscall-to-target call path, prerequisite resource, blocked condition, and current fuzzing feedback are exactly the fields a concept record needs for directed fuzzing.\n\n**Evidence.** Full text read. [Open-access chapter](https://link.springer.com/chapter/10.1007/978-3-031-90900-9_2); [preprint](https://arxiv.org/abs/2503.02301).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/SpencerL-Y/SyzAgent](https://github.com/SpencerL-Y/SyzAgent) (Scripts+results 110 MB, push 2025-08; submodules unlinked; source in SpencerL-Y/SyzLLM (Syzkaller fork, cites paper) + ChatAnalyzer). Dataset: 27 Linux kernel target functions (authors' benchmark); SyzDirect comparison on 3 targets — partially released [github.com/SpencerL-Y/SyzAgent](https://github.com/SpencerL-Y/SyzAgent). Models: GPT-4o.\n\n## 59. LLM-Powered Security Test Generation: Oracles, Vulnerability Probes, and Adversarial Inputs\n\n**Method.** A security-testing overview of LLM-generated oracles, vulnerability probes, and adversarial inputs.\n\n**Motivation.** Security testing needs tests that trigger and detect risky behavior, not only valid inputs or code coverage.\n\n**Dataset + shape.** Not a benchmark paper; no new evaluation dataset verified in this pass.\n\n**Evaluation.** No original aggregate result is asserted from this overview.\n\n**Concept applicability.** Strong for framing: model a security concept as CWE/fault hypothesis, entry point, source-to-sink path, guard/trigger condition, exploit input constraints, and a red/green oracle. Use primary evaluation papers such as VulEUT for empirical claims.\n\n**Evidence.** Abstract-only. [Primary source](https://doi.org/10.1109/MC.2025.3625694).\n\n**Artifacts (checked 2026-09-29).** Code: none found (IEEE Computer magazine article (Mastropaolo, Kuhn, Voas); no code found). Dataset: none identified (overview article) — unknown. Models: unknown.\n\n## 60. Do LLMs Generate Useful Test Oracles? An Empirical Study with an Unbiased Dataset\n\n**Method.** Generates concrete assertions for existing test prefixes under four prompt configurations, using 10 LLMs from Llama, Phi, and Qwen families. It compares generated assertions with programmer-written ones and measures mutation score.\n\n**Motivation.** Earlier oracle studies often use public benchmarks that may sit in model training data. The authors build a post-cutoff corpus to measure semantic oracle quality with lower leakage risk.\n\n**Dataset + shape.** 13,866 test oracles from 135 Java projects, all created after 2024-09-01. The study generates 610,104 LLM oracles across model/prompt combinations.\n\n**Evaluation.** LLM-generated oracles average 43% mutation score, close to 45% for human-written oracles. Test prefix plus invoked methods gives enough context for good results; extra code context did not materially improve them.\n\n**Concept applicability.** High, with a useful restraint: concepts should explain the intended postcondition and relevant state, but dumping more source may not help. Put the concept into an oracle-design stage after the input prefix is known, then score it with mutation testing.\n\n**Evidence.** Full text read. [Author PDF](https://homes.cs.washington.edu/~mernst/pubs/neurosymbolic-oracles-ase2025.pdf); [replication package](https://github.com/darthdaver/llm-prompts-empirical-study).\n\n**Artifacts (checked 2026-09-29).** Code: verified source [github.com/darthdaver/llm-prompts-empirical-study](https://github.com/darthdaver/llm-prompts-empirical-study) (Python test-miner, Ollama inference, RQ analysis + dataset.zip, 21 MB, push 2025-10). Dataset: 13,866 oracles from 135 post-2024-09 Java projects (SEART-sampled) — released by authors [github.com/darthdaver/llm-prompts-empirical-study/tree/main/resources](https://github.com/darthdaver/llm-prompts-empirical-study/tree/main/resources). Models: Qwen2.5-1.5B/14B/32B, Qwen2.5-Coder-1.5B/14B/32B, Phi-4-mini-3.8B, Phi-4-14B, Phi-4-reasoning-14B, Llama-3.3-70B.\n\n## Inaccessible or abstract-only in this batch\n\n- #48 Test Intention Guided LLM-Based Unit Test Generation\n- #50 DrWASI: LLM-assisted Differential Testing for WebAssembly System Interface Implementations\n- #52 Automated Test Generation Using Large Language Models\n- #54 Leveraging Large Language Models in Software Testing: A Review of Applications and Challenges\n- #59 LLM-Powered Security Test Generation: Oracles, Vulnerability Probes, and Adversarial Inputs\n"}, {"id": "batch-04", "label": "Batch 4", "range": "#61-80", "markdown": "# Full-text notes: catalog 61-80\n\nReviewed 2026-09-18. “Full text” means I read an official PDF, an author-hosted manuscript, or a published open-access PDF. “Abstract-only” means the primary landing page was accessible but no full text was available during this pass. Numbers appear only when the source states them.\n\n## 61. Initial Seeds Generation Based on Communication Logs Using LLM for IoT Device Fuzzing\n\n- **Method.** The LLM receives an IoT device type, captured communication logs, and a named vulnerability class, then produces initial fuzzing seeds. The fuzzer mutates those seeds and observes device crashes.\n- **Motivation.** Hand-building seeds for unfamiliar IoT protocols takes protocol and security expertise; weak seeds delay or prevent reachability of fault-handling code.\n- **Dataset + shape.** Two IoT-device types. The paper evaluates seeded campaigns for null-pointer-exception and buffer-overflow crashes; it does not present a large public benchmark dataset in the source I read.\n- **Evaluation results.** First crashes arrived after 0.40 s and 0.47 s for the two devices. After 24 hours, the LLM seeds found all reported null-pointer and buffer-overflow crashes that manually generated seeds did not find.\n- **Concept applicability.** High. A concept block can name the protocol state, message field, allowed value range, and desired vulnerability guard. This paper is close to “concept -> structured seed -> fuzzing” already; the useful ablation is whether a static concept extractor improves seeds beyond raw logs plus a vulnerability name.\n- **Evidence.** Full text. [IEICE/J-STAGE PDF and article](https://www.jstage.jst.go.jp/article/transinf/E109.D/1/E109.D_2024EDP7305/_article/-char/en)\n- **Artifacts (checked 2026-09-29).** Code: none found (No code/supplement (J-STAGE lists 0 supplementary files); no repo found). Dataset: 2 authors-built BusyBox IoT devices emulating a color bulb + IP camera; own comm logs — not released. Models: Mistral-7B-Instruct-v0.2.\n\n## 62. AugmenTest: Enhancing Tests with LLM-Driven Oracles\n\n- **Method.** AugmenTest adds JUnit assertions to existing tests. It asks an LLM to infer intended method behavior from documentation and developer comments, deliberately excluding implementation code. Variants use simple prompts, extended prompts, and retrieval augmentation.\n- **Motivation.** Generated tests often execute code but contain weak or missing assertions. Code-only oracle generation can reproduce an implementation defect instead of specifying the intended behavior.\n- **Dataset + shape.** 142 Java classes selected from a corpus of 418 projects and more than 27,000 classes. Every method in a selected class had a developer comment of at least 30 characters. Major mutants produced 203 distinct bug-revealing tests for evaluation.\n- **Evaluation results.** The conservative setting reports 30% correct assertions for the extended prompt, versus 8.2% for TOGA. RAG variants reached 18.2%, so retrieval did not help in this setup.\n- **Concept applicability.** High for the oracle half of the pipeline. Feed a concept as a candidate postcondition or invariant, then require the LLM to ground each assertion in comments, API documentation, or a reference implementation. The paper also warns against treating more context as automatically better.\n- **Evidence.** Full text. [Author arXiv manuscript](https://arxiv.org/abs/2501.17461); [official artifact](https://github.com/se-fbk/augmentest)\n- **Artifacts (checked 2026-09-29).** Code: verified source [github.com/se-fbk/augmentest](https://github.com/se-fbk/augmentest) (Python tool (src/: llm, rag, oracle_generation) + Docker, 51 MB, push 2026-06; Zenodo 10.5281/zenodo.13881826). Dataset: 142 Java classes from Gruber et al. 418-project corpus; 203 EvoSuite tests on Major mutants — released by authors [doi.org/10.5281/zenodo.13881826](https://doi.org/10.5281/zenodo.13881826). Models: GPT-4o, Meta-Llama-3-8B-Instruct (quantized), Nous-Hermes-Llama2-13B (quantized), text-embedding-3-large (RAG).\n\n## 63. Enriching Automatic Test Case Generation by Extracting Relevant Test Inputs from Bug Reports\n\n- **Method.** BRMiner mines bug reports for concrete input values, combines regular-expression extraction with GPT-3.5-turbo filtering, and passes retained values to EvoSuite.\n- **Motivation.** Search-based unit-test generators often make inputs that satisfy types but miss values that actually reproduce reported failures. Bug reports contain examples, stack traces, and reproduction data that generation tools leave unused.\n- **Dataset + shape.** Defects4J projects and their bug reports. The full paper evaluates extracted inputs and their effect on EvoSuite; the accessible sources describe the benchmark rather than a newly released fixed-size dataset.\n- **Evaluation results.** The published EMSE abstract reports a Relevant Input Rate of 60.03%, a Relevant Input Extraction Accuracy Rate of 31.71%, and 58 unique bugs detected (an earlier manuscript version gave 68.68% with regex vs 50.21% without, and 45 bugs missed by the baseline). The enriched runs found bugs that the baseline missed and improved line and instruction coverage across the studied projects.\n- **Conc
