[project]
name = "concepttester"
version = "0.1.0"
description = "Concept-guided vulnerability-triggering test generation on the Magma benchmark"
requires-python = ">=3.11"
dependencies = [
    "beniget>=0.5.1",
    "coverage>=7.16.1",
    # LLM teacher qua langchain (magma/loop.py, llm_client.py)
    "langchain-core>=1.6",
    "langchain-google-vertexai>=3.2.4,<4",
    "langchain-groq>=1.1",      # LLM_PROVIDER=groq  (gpt-oss-120b)
    "langchain-openai>=1.6",    # LLM_PROVIDER=router (9router / OpenAI-compatible -> Gemini)
    "piexif>=1.1.3",
    "pypdf>=6",                 # doc paper PDF
    "pydantic>=2.14,<3",         # compact testing-arm catalogue schema
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "sortedcontainers>=2.4.0",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
# LLM_PROVIDER=vertex: goi Vertex AI native. Cai bang:  uv sync --extra vertex
vertex = ["langchain-google-vertexai>=3.2.4,<4"]
testcase = ["datasets>=4"]
eval = ["pytest>=9", "pytest-cov>=7", "sortedcontainers>=2"]
testing-tools = ["hypothesis==6.170.14", "allpairspy==2.5.1"]
control-flow = ["hypothesis==6.170.14", "python-graphs==1.2.3"]

[tool.uv]
# oracle.py / loop_symcc.py / export_hints.py chi dung stdlib -> khong can dep nao
package = false
