# Accelerate/DeepSpeed config cho Kaggle 2x T4 (16GB). Full-FT 3B chi vua neu ZeRO-3 + CPU offload.
# T4 = Turing -> KHONG ho tro bf16 nhanh -> dung fp16. (Paper dung bf16 tren A100.)
# Neu chi 1 GPU (Colab/P100): doi num_processes: 1.
compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  gradient_accumulation_steps: 2
  gradient_clipping: 1.0
  offload_optimizer_device: cpu     # offload -> vua VRAM T4 (cham hon, nhung fit)
  offload_param_device: cpu
  zero3_init_flag: true
  zero3_save_16bit_model: true
  zero_stage: 3
distributed_type: DEEPSPEED
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: fp16               # T4: fp16 (KHONG bf16). Neu overflow -> giam lr hoac bf16 (cham).
num_machines: 1
num_processes: 2                    # 2x T4. Colab 1 GPU -> 1.
rdzv_backend: static
same_network: true
use_cpu: false
