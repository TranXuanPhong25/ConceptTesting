[project]
name = "PbtEval"
version = "0.1.0"
description = "Evaluation tool for PBT"
readme = "README.md"
authors = [
    { name = "Hidetake Tanaka" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.0.0",
    "hypothesis>=6.131.18",
    "numpy>=2.2.3",
    "openai>=1.79.0",
    "pytest>=8.3.5",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "tabulate>=0.9.0",
    "types-requests>=2.32.0.20241016",
]

[project.scripts]
pbteval = "pbteval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.9.9",
    "types-tabulate>=0.9.0",
]

[tool.mypy]
strict = true
disallow_any_explicit = true

[tool.ruff]
exclude = ["output/*"]

[tool.ruff.lint]
extend-select = [
    "I",  # isort
    "PTH", # pathlib
    "UP", # pyupgrade
    "ARG", # detect unused arguments
]
